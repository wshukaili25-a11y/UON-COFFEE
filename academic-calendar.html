<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060b1b"><title>التقويم الأكاديمي 2026/2027 | UON Hub</title>
<link rel="stylesheet" href="css/app.css?v=44.0.2">
<style>
.calendar-page{max-width:1050px;margin:auto}.calendar-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.calendar-list{display:grid;gap:12px;margin-top:18px}.calendar-event{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.calendar-icon{font-size:26px}.calendar-event h3{margin:0 0 6px}.calendar-date{margin:0;color:var(--muted)}.calendar-error{padding:20px;border:1px solid #ef4444;border-radius:16px;color:#fecaca}@media(max-width:650px){.calendar-event{grid-template-columns:45px 1fr}.calendar-event button{grid-column:1/-1;width:100%}.calendar-actions button{width:100%}}
</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">U1</span>UON <span>Hub</span></a><ul class="nav-links"><li><a href="index.html">الرئيسية</a></li><li><a href="tools.html" class="active">الأدوات</a></li><li><a href="summaries.html">الملخصات</a></li><li><a href="groups.html">المجموعات</a></li></ul></div></header>
<main class="v14-page-main"><section class="page-hero"><div class="container calendar-page"><span class="badge">Academic Calendar · 2026/2027</span><h1>📚 التقويم الأكاديمي</h1><p>أهم مواعيد الفصل الدراسي الأول 2026/2027 — واحفظها مباشرة في تقويم هاتفك.</p></div></section>
<section class="section"><div class="container calendar-page"><div class="calendar-actions"><button class="btn primary" id="downloadAll" type="button">📅 إضافة كل المواعيد للتقويم</button><button class="btn" id="shareCalendar" type="button">📤 مشاركة ملف التقويم</button></div><div id="calendarList" class="calendar-list"><p>جاري تحميل المواعيد…</p></div></div></section></main>
<script>
(function(){
'use strict';
const EVENTS=[
['📝','فترة التسجيل الثانية','2026-08-30','2026-09-03'],['🎓','بداية الدراسة + أسبوع الحذف والإضافة','2026-09-06','2026-09-06'],['➕','فترة الحذف والإضافة','2026-09-06','2026-09-10'],['👋','أسبوع التهيئة للطلبة الجدد','2026-09-20','2026-09-24'],['📝','الاختبار الأول – الأسبوع الأول','2026-10-11','2026-10-15'],['📝','الاختبار الأول – الأسبوع الثاني','2026-10-18','2026-10-22'],['📋','الاختبار الثاني – الأسبوع الأول','2026-11-15','2026-11-19'],['📋','الاختبار الثاني – الأسبوع الثاني','2026-11-29','2026-12-03'],['⚠️','آخر يوم للانسحاب بدرجة (W)','2026-12-10','2026-12-10'],['📚','فترة التسجيل الأولى لفصل الربيع','2026-12-13','2026-12-17'],['⚠️','آخر يوم للانسحاب بدرجة (WF)','2026-12-17','2026-12-17'],['🏫','آخر يوم للدراسة','2026-12-24','2026-12-24'],['🏆','الاختبارات النهائية','2026-12-27','2027-01-07']
];
const list=document.getElementById('calendarList');
function date(d){return new Date(d+'T00:00:00+04:00');}
function fmt(d){return new Intl.DateTimeFormat('ar-OM',{day:'numeric',month:'long',year:'numeric'}).format(date(d));}
function render(){
 if(!list)return;
 list.innerHTML=EVENTS.map(function(e,i){return '<article class="calendar-event"><div class="calendar-icon">'+e[0]+'</div><div><h3>'+e[1]+'</h3><p class="calendar-date">'+fmt(e[2])+(e[2]!==e[3]?' – '+fmt(e[3]):'')+'</p></div><button class="btn" type="button" data-calendar-index="'+i+'">📅 إضافة للتقويم</button></article>';}).join('');
 document.querySelectorAll('[data-calendar-index]').forEach(function(b){b.addEventListener('click',function(){download([EVENTS[Number(b.dataset.calendarIndex)]]);});});
}
function nextDay(s){const d=date(s);d.setUTCDate(d.getUTCDate()+1);return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0');}
function ics(items){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UON Hub//Academic Calendar//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:UON Hub - التقويم الأكاديمي 2026/2027'];items.forEach(function(e,i){lines.push('BEGIN:VEVENT','UID:uonhub-academic-2026-'+i+'@uonhub.space','DTSTAMP:20260821T000000Z','DTSTART;VALUE=DATE:'+e[2].replaceAll('-',''),'DTEND;VALUE=DATE:'+nextDay(e[3]),'SUMMARY:'+e[1],'DESCRIPTION:UON Hub - التقويم الأكاديمي للفصل الدراسي الأول 2026/2027','END:VEVENT');});lines.push('END:VCALENDAR');return lines.join('\r\n')+'\r\n';}
function download(items){const url=URL.createObjectURL(new Blob([ics(items)],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='UON-Hub-Academic-Calendar-2026-2027.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1500);}
render();
document.getElementById('downloadAll')?.addEventListener('click',function(){download(EVENTS);});
document.getElementById('shareCalendar')?.addEventListener('click',async function(){const f=new File([ics(EVENTS)],'UON-Hub-Academic-Calendar-2026-2027.ics',{type:'text/calendar'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({title:'التقويم الأكاديمي 2026/2027',text:'التقويم الأكاديمي من UON Hub',files:[f]});}catch(_){}}else download(EVENTS);});
})();
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b1b"><title>التقويم الأكاديمي 2026/2027 | UON Hub</title><link rel="stylesheet" href="css/app.css?v=44.0.2"><style>.calendar-page{max-width:1050px;margin:auto}.calendar-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.calendar-list{display:grid;gap:12px;margin-top:18px}.calendar-event{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.calendar-icon{font-size:26px}.calendar-event h3{margin:0 0 6px}.calendar-date{margin:0;color:var(--muted)}@media(max-width:650px){.calendar-event{grid-template-columns:45px 1fr}.calendar-event button{grid-column:1/-1;width:100%}.calendar-actions button{width:100%}}</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">U1</span>UON <span>Hub</span></a><ul class="nav-links"><li><a href="index.html">الرئيسية</a></li><li><a href="tools.html" class="active">الأدوات</a></li><li><a href="summaries.html">الملخصات</a></li><li><a href="groups.html">المجموعات</a></li></ul></div></header>
<main class="v14-page-main"><section class="page-hero"><div class="container calendar-page"><span class="badge">Academic Calendar · 2026/2027</span><h1>📚 التقويم الأكاديمي</h1><p>أهم مواعيد الفصل الدراسي الأول 2026/2027 — واحفظها مباشرة في تقويم هاتفك.</p></div></section><section class="section"><div class="container calendar-page"><div class="calendar-actions"><button class="btn primary" id="downloadAll">📅 إضافة كل المواعيد للتقويم</button><button class="btn" id="shareCalendar">📤 مشاركة ملف التقويم</button></div><div id="calendarList" class="calendar-list"></div></div></section></main>
<script>
const EVENTS=[['📝','فترة التسجيل الثانية','2026-08-30','2026-09-03'],['🎓','بداية الدراسة + أسبوع الحذف والإضافة','2026-09-06','2026-09-06'],['➕','فترة الحذف والإضافة','2026-09-06','2026-09-10'],['👋','أسبوع التهيئة للطلبة الجدد','2026-09-20','2026-09-24'],['📝','الاختبار الأول – الأسبوع الأول','2026-10-11','2026-10-15'],['📝','الاختبار الأول – الأسبوع الثاني','2026-10-18','2026-10-22'],['📋','الاختبار الثاني – الأسبوع الأول','2026-11-15','2026-11-19'],['📋','الاختبار الثاني – الأسبوع الثاني','2026-11-29','2026-12-03'],['⚠️','آخر يوم للانسحاب بدرجة (W)','2026-12-10','2026-12-10'],['📚','فترة التسجيل الأولى لفصل الربيع','2026-12-13','2026-12-17'],['⚠️','آخر يوم للانسحاب بدرجة (WF)','2026-12-17','2026-12-17'],['🏫','آخر يوم للدراسة','2026-12-24','2026-12-24'],['🏆','الاختبارات النهائية','2026-12-27','2027-01-07']];
const fmt=d=>new Intl.DateTimeFormat('ar-OM',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00'));
const list=document.getElementById('calendarList');list.innerHTML=EVENTS.map((e,i)=>`<article class="calendar-event"><div class="calendar-icon">${e[0]}</div><div><h3>${e[1]}</h3><p class="calendar-date">${fmt(e[2])}${e[2]!==e[3]?' – '+fmt(e[3]):''}</p></div><button class="btn" data-i="${i}">📅 إضافة للتقويم</button></article>`).join('');
function ics(items){const next=d=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+1);return x.toISOString().slice(0,10).replaceAll('-','')};return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UON Hub//Academic Calendar//AR','CALSCALE:GREGORIAN',...items.flatMap((e,i)=>['BEGIN:VEVENT',`UID:uonhub-${i}@uonhub.space`,`DTSTART;VALUE=DATE:${e[2].replaceAll('-','')}`,`DTEND;VALUE=DATE:${next(e[3])}`,`SUMMARY:${e[1]}`,'END:VEVENT']),'END:VCALENDAR'].join('\r\n')+'\r\n'}
function download(items){const url=URL.createObjectURL(new Blob([ics(items)],{type:'text/calendar'}));const a=document.createElement('a');a.href=url;a.download='UON-Hub-Academic-Calendar-2026-2027.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>download([EVENTS[Number(b.dataset.i)]]));document.getElementById('downloadAll').onclick=()=>download(EVENTS);document.getElementById('shareCalendar').onclick=async()=>{const f=new File([ics(EVENTS)],'UON-Hub-Academic-Calendar-2026-2027.ics',{type:'text/calendar'});if(navigator.share&&navigator.canShare?.({files:[f]})){try{await navigator.share({title:'التقويم الأكاديمي 2026/2027',files:[f]})}catch(e){}}else download(EVENTS)};
</script></body></html>

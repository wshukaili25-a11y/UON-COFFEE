<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07130f">
  <title>سوق الطلاب | UON Hub</title>
  <meta name="description" content="سوق طلاب جامعة نزوى للبيع والشراء والتبادل مع مراجعة الإعلانات قبل النشر.">
  <link rel="canonical" href="https://uonhub.space/marketplace.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=53.2.0">
  <link rel="stylesheet" href="css/student-tools-v53.css?v=53.2.0">
  <link rel="stylesheet" href="css/community-v53.css?v=53.2.0">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="community-page" data-uon-page="marketplace">
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">U</span><span class="brand-name">UON <b>Hub</b></span></a><div class="nav-actions"><a class="btn" href="index.html">الرئيسية</a></div></div></header>
<main>
  <section class="community-hero"><div class="community-shell"><span class="community-badge">بين الطلبة</span><h1>سوق الطلاب</h1><p>مساحة بسيطة لبيع وشراء وتبادل الكتب والأدوات الدراسية. الإعلان يرسل للمراجعة أولًا قبل ظهوره للطلبة.</p></div></section>
  <section class="community-shell">
    <div class="community-stats"><div class="community-stat"><strong id="sellCount">0</strong><span>للبيع</span></div><div class="community-stat"><strong id="buyCount">0</strong><span>للشراء</span></div><div class="community-stat"><strong id="exchangeCount">0</strong><span>للتبادل</span></div></div>
    <div class="community-toolbar"><input class="community-search" id="searchInp" type="search" autocomplete="off" placeholder="ابحث عن كتاب أو أداة…" aria-label="البحث في سوق الطلاب"><button class="community-primary" id="openAdd" type="button">+ إضافة إعلان</button></div>
    <div class="community-filters" id="filters"><button class="community-filter active" data-filter="all">الكل</button><button class="community-filter" data-filter="sell">للبيع</button><button class="community-filter" data-filter="buy">للشراء</button><button class="community-filter" data-filter="exchange">تبادل</button><button class="community-filter" data-filter="free">مجاني</button></div>
    <div class="community-grid" id="itemsGrid" aria-live="polite"><div class="community-empty">جاري تحميل الإعلانات…</div></div>
  </section>
</main>
<div class="community-modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addTitle"><div class="community-modal-card"><h2 id="addTitle">إضافة إعلان للمراجعة</h2><div class="community-field"><label for="mType">نوع الإعلان</label><select class="community-input" id="mType"><option value="sell">بيع</option><option value="buy">شراء</option><option value="exchange">تبادل</option></select></div><div class="community-field"><label for="mTitle">العنوان</label><input class="community-input" id="mTitle" maxlength="120" placeholder="مثال: كتاب MATH101"></div><div class="community-field"><label for="mDesc">الوصف</label><textarea class="community-input" id="mDesc" rows="3" maxlength="800" placeholder="الحالة، الطبعة أو أي تفاصيل مهمة"></textarea></div><div class="community-field"><label for="mPrice">السعر بالريال العماني</label><input class="community-input" id="mPrice" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0 = مجاني"></div><div class="community-field"><label for="mCondition">الحالة</label><select class="community-input" id="mCondition"><option value="new">جديد</option><option value="good">جيد</option><option value="used">مستعمل</option></select></div><div class="community-field"><label for="mPhone">رقم واتساب للتواصل</label><input class="community-input" id="mPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="968XXXXXXXX"></div><div class="community-modal-actions"><button class="community-secondary" id="closeAdd" type="button">إلغاء</button><button class="community-primary" id="submitItem" type="button">إرسال للمراجعة</button></div></div></div>
<div class="community-toast" id="toast"></div>
<script>
const SB='https://irkhvydgxpseflggbeqq.supabase.co',KEY='sb_publishable_gZ9tyM1udrkuQIXHqDtToQ_FyFmePgH',H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const SESSION_KEY='uon_marketplace_session_v2';
function uuid(){try{return crypto.randomUUID()}catch{return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}}
function sessionId(){let value='';try{value=localStorage.getItem(SESSION_KEY)||''}catch{}if(!/^[0-9a-f-]{36}$/i.test(value)){value=uuid();try{localStorage.setItem(SESSION_KEY,value)}catch{}}return value}
const SESSION_ID=sessionId();
let items=[],filter='all';
function toast(m,e=false){const t=$('#toast');t.textContent=m;t.className='community-toast show'+(e?' error':'');setTimeout(()=>t.className='community-toast',2800)}
async function rpc(name,body){const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(body||{})});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok){const err=new Error(data?.message||text||'request_failed');err.code=data?.code||'';throw err}return data}
async function load(){try{const data=await rpc('uon_marketplace_feed',{p_limit:200});items=Array.isArray(data)?data:[]}catch{items=[]}render();stats()}
function stats(){$('#sellCount').textContent=items.filter(x=>x.type==='sell').length;$('#buyCount').textContent=items.filter(x=>x.type==='buy').length;$('#exchangeCount').textContent=items.filter(x=>x.type==='exchange').length}
function render(){const q=$('#searchInp').value.trim().toLowerCase();let data=items.filter(x=>filter==='all'||(filter==='free'?Number(x.price||0)===0:x.type===filter));if(q)data=data.filter(x=>String(x.title||'').toLowerCase().includes(q)||String(x.description||'').toLowerCase().includes(q));const type={sell:'للبيع',buy:'للشراء',exchange:'للتبادل'},cond={new:'جديد',good:'جيد',used:'مستعمل'};$('#itemsGrid').innerHTML=data.length?data.map(x=>{const phone=String(x.phone||'').replace(/\D/g,'');return `<article class="community-card"><div class="community-meta"><span class="community-chip green">${esc(type[x.type]||x.type||'إعلان')}</span><span class="community-chip">${esc(cond[x.condition]||'جيد')}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.description||'بدون وصف إضافي')}</p><div class="community-price">${Number(x.price||0)===0?'مجاني':esc(x.price)+' ر.ع'}</div>${phone?`<a class="community-action" href="https://wa.me/${encodeURIComponent(phone)}" target="_blank" rel="noopener noreferrer">تواصل عبر واتساب</a>`:''}</article>`}).join(''):'<div class="community-empty">ما فيه إعلانات مطابقة حاليًا. تقدر تضيف إعلان جديد للمراجعة.</div>'}
$('#searchInp').addEventListener('input',render);
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('.community-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
const modal=$('#addModal');$('#openAdd').onclick=()=>modal.classList.add('show');$('#closeAdd').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
$('#submitItem').onclick=async()=>{const title=$('#mTitle').value.trim(),phone=$('#mPhone').value.replace(/\D/g,'');if(!title||phone.length<8)return toast('أدخل عنوان الإعلان ورقم واتساب صحيح',true);const button=$('#submitItem');button.disabled=true;try{await rpc('uon_submit_marketplace_item_v2',{p_title:title,p_description:$('#mDesc').value.trim(),p_type:$('#mType').value,p_price:Number($('#mPrice').value||0),p_condition:$('#mCondition').value,p_phone:phone,p_session_id:SESSION_ID});modal.classList.remove('show');['mTitle','mDesc','mPrice','mPhone'].forEach(id=>document.getElementById(id).value='');toast('تم إرسال الإعلان للمراجعة ✅')}catch(error){toast(String(error?.message||'').includes('rate_limited')?'وصلت للحد المؤقت للإرسال، جرّب بعد شوي':'تعذر إرسال الإعلان، حاول مرة ثانية',true)}finally{button.disabled=false}};
load();
</script>
<script type="module" src="/js/pwa-init.js?v=53.2.0"></script>
</body>
</html>

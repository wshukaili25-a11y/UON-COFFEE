 <style>.schedule-wrap{max-width:1180px;margin:auto}.schedule-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.schedule-stats .card{text-align:center;padding:16px}.schedule-stats strong{display:block;font-size:30px}.schedule-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.schedule-week{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;min-width:1050px}.schedule-day{padding:14px;min-height:240px}.schedule-day header{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #ffffff12;padding-bottom:10px;margin-bottom:10px}.schedule-day header h3{margin:0}.schedule-day header span{font-size:11px;opacity:.65}.schedule-event{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:11px;border-radius:13px;background:#0002;border:1px solid #ffffff10;margin-bottom:8px}.schedule-event strong,.schedule-event small{display:block}.schedule-event small{opacity:.68;margin-top:3px}.schedule-event .icon-btn{width:32px;height:32px;flex:0 0 32px}@media print{.site-header,.page-hero,.schedule-form,.site-footer,.uon-independent-notice,.uon-ai-fab{display:none!important}.schedule-week{min-width:0;grid-template-columns:repeat(5,1fr)}body{background:#fff!important;color:#111!important}.schedule-day,.schedule-event{border-color:#bbb!important;background:#fff!important}}@media(max-width:700px){.schedule-stats{grid-template-columns:1fr}.schedule-actions .btn{flex:1}}</style>

 <header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">U</span><span class="brand-name">UON <b>Hub</b></span></a><div class="nav-actions"><button class="icon-btn mobile-menu" id="menuBtn" type="button">☰</button></div></div></header>
 <main data-feature="schedule"><section class="page-hero"><div class="container schedule-wrap"><span class="badge">تنظيم الأسبوع</span><h1>الجدول الدراسي</h1><p>أضف المحاضرات، واحفظ الجدول على جهازك، ويكشف لك النظام أي تعارض في الوقت.</p></div></section><section class="section"><div class="container schedule-wrap"><div class="schedule-stats"><div class="card"><span>عدد المحاضرات</span><strong id="scheduleCount">0</strong></div><div class="card"><span>الساعات الأسبوعية</span><strong id="scheduleHours">0.0</strong></div></div><div class="card form-card schedule-form"><div class="form-grid"><div class="field"><label>المادة</label><input id="course" maxlength="30" placeholder="STAT101"></div><div class="field"><label>اليوم</label><select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option></select></div><div class="field"><label>من</label><input id="start" type="time" value="08:00"></div><div class="field"><label>إلى</label><input id="end" type="time" value="09:30"></div><div class="field"><label>القاعة</label><input id="room" maxlength="50"></div><div class="field"><label>الدكتور</label><input id="teacher" maxlength="100"></div></div><div class="schedule-actions"><button class="btn primary" id="add" type="button">إضافة المحاضرة</button><button class="btn" id="printSchedule" type="button">طباعة</button><button class="btn" id="exportSchedule" type="button">تصدير نسخة</button><button class="btn danger" id="clearSchedule" type="button">مسح الجدول</button></div></div><div class="card form-card" style="margin-top:18px;overflow:auto"><div id="week" class="schedule-week"></div></div></div></section></main>
 <div class="uon-independent-notice"><span class="uon-independent-notice__icon">i</span><p><strong>تنبيه:</strong> الجدول محفوظ على جهازك فقط، وUON Hub مشروع طلابي مستقل.</p></div><footer class="site-footer"><div class="container footer-managed"><p class="footer-top-text">رَبِّ زِدْنِي عِلْمًا</p><p class="footer-rights-text">جميع الحقوق محفوظة © 2026 UON Hub</p></div></footer><div id="toast" class="toast"></div><aside class="notification-drawer" id="notificationDrawer"><div class="section-head"><h3>الإشعارات</h3><button class="icon-btn" id="closeNotifications">✕</button></div><div id="notificationItems" class="notification-list"></div></aside>

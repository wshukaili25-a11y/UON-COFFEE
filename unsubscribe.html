<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="إلغاء الاشتراك في إعلانات UON Hub.">
  <meta name="robots" content="noindex,nofollow">
  <title>إلغاء الاشتراك | UON Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/uonhub-192-v75.png">
  <style>
    :root{color-scheme:dark;--bg:#06100c;--bg2:#091711;--card:rgba(10,25,18,.88);--line:rgba(105,210,153,.16);--text:#f4f8f5;--muted:#9db0a5;--green:#18a465;--green2:#76d8a4;--shadow:0 32px 88px rgba(0,0,0,.33)}
    html[data-theme="light"]{color-scheme:light;--bg:#f2f7f4;--bg2:#e8f2ec;--card:rgba(255,255,255,.94);--line:rgba(16,104,62,.13);--text:#0d1b14;--muted:#617269;--green:#118a54;--green2:#16784d;--shadow:0 27px 68px rgba(20,72,43,.11)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;background:radial-gradient(circle at 84% 10%,rgba(27,176,105,.14),transparent 31%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text)}
    .shell{min-height:100svh;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .card{width:min(640px,100%);position:relative;text-align:center;padding:42px 26px;border:1px solid var(--line);border-radius:32px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow:hidden}.card:before{content:"";position:absolute;inset:0 14% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(113,218,162,.44),transparent)}
    .logo-wrap{width:80px;height:80px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;background:rgba(24,164,101,.08);border:1px solid rgba(24,164,101,.15)}.logo{width:60px;height:60px;border-radius:50%;object-fit:cover}
    .code{font-size:clamp(72px,20vw,128px);line-height:.84;font-weight:900;letter-spacing:-.08em;color:var(--green2);margin-top:6px;text-shadow:0 12px 36px rgba(24,164,101,.10)}
    h1{margin:22px 0 9px;font-size:clamp(25px,6vw,38px);line-height:1.28;font-weight:900;letter-spacing:-.025em}.lead{max-width:470px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.9}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{min-height:48px;padding:0 18px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:linear-gradient(135deg,#15975d,#0d7d4c);border-color:transparent;color:#fff}
    .bottom{margin-top:23px;padding-top:17px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;color:var(--muted);font-size:12px}.bottom a{color:var(--text);font-weight:900;text-decoration:none;direction:ltr}
    @media(max-width:460px){.card{padding:34px 18px;border-radius:26px}.actions{display:grid}.btn{width:100%}.logo-wrap{width:72px;height:72px;border-radius:23px}.logo{width:55px;height:55px}}
  </style>
 <link rel="stylesheet" href="/css/hub-studio.css?v=1.2.0" id="hubStudioStyle">
 <script src="/js/hub-studio-boot.js?v=1.0.0"></script>
 <script src="/js/hub-studio.js?v=1.1.0" defer></script>
</head>
<body data-uon-page="unsubscribe">
  <main class="shell">
    <section class="card">
      <div class="logo-wrap"><img class="logo" src="/assets/uonhub-logo-original-20260904.jpeg" alt="UON Hub"></div>
      <h1 id="title">إلغاء الاشتراك في الإعلانات</h1>
      <p class="lead" id="lead">اضغط الزر تحت ونوقف إرسال إعلانات UON Hub لبريدك فورًا. الملخصات والجداول اللي تطلبها بنفسك بتظل توصلك عادي.</p>
      <div class="actions">
        <button class="btn primary" id="confirm" type="button">ألغِ اشتراكي</button>
        <a class="btn" href="/index.html">الرجوع للرئيسية</a>
      </div>
      <div class="bottom"><span>UON Hub</span><span>·</span><a href="https://www.instagram.com/uonhub" target="_blank" rel="noopener noreferrer">@uonhub</a></div>
    </section>
  </main>
  <script>
    (()=>{let theme='dark';try{theme=localStorage.getItem('uon_theme')==='light'?'light':'dark'}catch{}document.documentElement.dataset.theme=theme;
    const token=new URLSearchParams(location.search).get('t')||'',btn=document.getElementById('confirm'),title=document.getElementById('title'),lead=document.getElementById('lead');
    const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token);
    if(!valid){title.textContent='الرابط غير مكتمل';lead.textContent='افتح رابط إلغاء الاشتراك من آخر رسالة وصلتك من UON Hub كما هو.';btn.hidden=true;return}
    btn.onclick=async()=>{btn.disabled=true;btn.textContent='لحظة…';
      try{const r=await fetch('https://irkhvydgxpseflggbeqq.supabase.co/functions/v1/summary-email',{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_gZ9tyM1udrkuQIXHqDtToQ_FyFmePgH'},body:JSON.stringify({action:'unsubscribe',token})});if(!r.ok)throw 0;
        title.textContent='تم إلغاء اشتراكك ✓';lead.textContent='ما بيوصلك أي إعلان من UON Hub بعد الحين. إذا غيرت رأيك، فعّل خيار الاشتراك مرة ثانية لما تطلب ملخص أو جدول.';btn.hidden=true}
      catch{btn.disabled=false;btn.textContent='حاول مرة ثانية';lead.textContent='صار خلل بسيط. جرّب مرة ثانية بعد شوي.'}};})();
  </script>
</body>
</html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>بنك الأسئلة | UON Hub</title><meta name="description" content="بنك أسئلة طلابي للمذاكرة ومشاركة الأسئلة السابقة في UON Hub."><link rel="canonical" href="https://uonhub.space/questions.html"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css?v=53.3.0"><link rel="stylesheet" href="css/student-tools-v53.css?v=53.3.0"><link rel="stylesheet" href="css/community-v53.css?v=53.3.0"><link rel="manifest" href="/manifest.webmanifest"></head><body class="community-page" data-uon-page="questions"><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">U</span><span class="brand-name">UON <b>Hub</b></span></a><div class="nav-actions"><a class="btn" href="courses.html">المقررات</a><a class="btn" href="index.html">الرئيسية</a></div></div></header><main><section class="community-hero"><div class="community-shell"><span class="community-badge">مذاكرة بين الطلبة</span><h1>بنك الأسئلة</h1><p>ابحث في الأسئلة المضافة من الطلبة حسب الكلية والمادة، وافتح الإجابة وقت ما تحتاجها. المحتوى الطلابي للمساعدة في المذاكرة وليس مصدرًا رسميًا للاختبارات.</p></div></section><section class="community-shell"><div class="community-stats"><div class="community-stat"><strong id="totalQ">0</strong><span>سؤال</span></div><div class="community-stat"><strong id="totalSubjects">0</strong><span>مادة</span></div><div class="community-stat"><strong id="totalColleges">0</strong><span>كلية</span></div></div><div class="community-toolbar"><input class="community-search" id="searchInp" type="search" autocomplete="off" placeholder="ابحث بالسؤال أو اسم المادة…" aria-label="البحث في بنك الأسئلة"><button class="community-primary" id="openAdd" type="button">+ إضافة سؤال</button></div><div class="community-filters" id="filters"><button class="community-filter active" data-filter="all">الكل</button><button class="community-filter" data-filter="اقتصاد">اقتصاد</button><button class="community-filter" data-filter="هندسة">هندسة</button><button class="community-filter" data-filter="علوم">علوم</button><button class="community-filter" data-filter="صحية">صحية</button><button class="community-filter" data-filter="تأسيس">تأسيس</button></div><div class="community-list" id="questionsList" aria-live="polite"><div class="community-empty">جاري تحميل الأسئلة…</div></div></section></main><div class="community-modal" id="qModal" role="dialog" aria-modal="true" aria-labelledby="qModalTitle"><div class="community-modal-card"><h2 id="qModalTitle">إضافة سؤال للمراجعة</h2><div class="community-field"><label for="qCollege">الكلية</label><select class="community-input" id="qCollege"><option value="">اختر</option><option>اقتصاد</option><option>هندسة</option><option>علوم</option><option>صحية</option><option>تأسيس</option></select></div><div class="community-field"><label for="qSubject">المادة</label><input class="community-input" id="qSubject" maxlength="100" placeholder="مثال: STAT101"></div><div class="community-field"><label for="qType">نوع السؤال</label><select class="community-input" id="qType"><option value="mcq">اختيار متعدد</option><option value="essay">مقالي</option><option value="tf">صح / خطأ</option><option value="calc">حسابي</option></select></div><div class="community-field"><label for="qYear">السنة / الفصل — اختياري</label><input class="community-input" id="qYear" maxlength="40" placeholder="2026 - فصل 1"></div><div class="community-field"><label for="qText">السؤال</label><textarea class="community-input" id="qText" rows="4" maxlength="1200"></textarea></div><div class="community-field"><label for="qAnswer">الإجابة — اختياري</label><textarea class="community-input" id="qAnswer" rows="3" maxlength="1200"></textarea></div><div class="community-modal-actions"><button class="community-secondary" id="closeAdd" type="button">إلغاء</button><button class="community-primary" id="submitQ" type="button">إرسال للمراجعة</button></div></div></div><div class="community-toast" id="toast"></div><script>const SB='https://irkhvydgxpseflggbeqq.supabase.co',KEY='sb_publishable_gZ9tyM1udrkuQIXHqDtToQ_FyFmePgH',H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],filter='all';let liked=JSON.parse(localStorage.getItem('uon_liked_q')||'[]');const $=s=>document.querySelector(s);function toast(m,e=false){const t=$('#toast');t.textContent=m;t.className='community-toast show'+(e?' error':'');setTimeout(()=>t.className='community-toast',2600)}async function load(){try{const r=await fetch(SB+'/rest/v1/exam_questions?select=*&approved=eq.true&order=votes.desc',{headers:H});if(!r.ok)throw 0;rows=await r.json()}catch{rows=[]}render();stats()}function stats(){$('#totalQ').textContent=rows.length;$('#totalSubjects').textContent=new Set(rows.map(x=>x.subject).filter(Boolean)).size;$('#totalColleges').textContent=new Set(rows.map(x=>x.college).filter(Boolean)).size}function render(){const q=$('#searchInp').value.trim().toLowerCase();const data=rows.filter(x=>(filter==='all'||x.college===filter)&&(!q||String(x.text||'').toLowerCase().includes(q)||String(x.subject||'').toLowerCase().includes(q)));$('#questionsList').innerHTML=data.length?data.map(x=>`<article class="community-card"><div class="community-meta"><span class="community-chip green">${esc(x.college||'عام')}</span><span class="community-chip">${esc(x.subject||'بدون مادة')}</span>${x.year?`<span class="community-chip">${esc(x.year)}</span>`:''}</div><h3>${esc(x.text)}</h3>${x.answer?`<div class="community-answer" id="a-${x.id}"><strong>الإجابة:</strong> ${esc(x.answer)}</div>`:''}<div class="community-actions">${x.answer?`<button class="community-soft-btn" data-answer="${x.id}">عرض الإجابة</button>`:''}<button class="community-soft-btn" data-like="${x.id}" ${liked.includes(x.id)?'disabled':''}>♡ ${Number(x.votes||0)}</button></div></article>`).join(''):'<div class="community-empty">ما حصلنا أسئلة مطابقة. تقدر تضيف أول سؤال للمراجعة.</div>'}$('#searchInp').addEventListener('input',render);$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('.community-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('#questionsList').addEventListener('click',async e=>{const a=e.target.closest('[data-answer]');if(a){const el=document.getElementById('a-'+a.dataset.answer);el?.classList.toggle('show');a.textContent=el?.classList.contains('show')?'إخفاء الإجابة':'عرض الإجابة';return}const b=e.target.closest('[data-like]');if(!b||liked.includes(Number(b.dataset.like)))return;const x=rows.find(r=>String(r.id)===b.dataset.like);if(!x)return;b.disabled=true;try{const r=await fetch(SB+'/rest/v1/rpc/increment_exam_question_vote',{method:'POST',headers:H,body:JSON.stringify({p_id:x.id})});if(!r.ok)throw 0;const votes=await r.json();x.votes=Number(votes||x.votes||0);liked.push(x.id);localStorage.setItem('uon_liked_q',JSON.stringify(liked));render()}catch{b.disabled=false;toast('تعذر تسجيل التصويت',true)}});const modal=$('#qModal');$('#openAdd').onclick=()=>modal.classList.add('show');$('#closeAdd').onclick=()=>modal.classList.remove('show');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});$('#submitQ').onclick=async()=>{const college=$('#qCollege').value,subject=$('#qSubject').value.trim(),text=$('#qText').value.trim();if(!college||!subject||!text)return toast('أدخل الكلية والمادة والسؤال',true);const body={college,subject,text,answer:$('#qAnswer').value.trim()||null,type:$('#qType').value,year:$('#qYear').value.trim()||null,votes:0,approved:false};const button=$('#submitQ');button.disabled=true;try{const r=await fetch(SB+'/rest/v1/exam_questions',{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw 0;modal.classList.remove('show');['qSubject','qText','qAnswer','qYear'].forEach(id=>document.getElementById(id).value='');$('#qCollege').value='';toast('تم إرسال السؤال للمراجعة ✅')}catch{toast('تعذر إرسال السؤال',true)}finally{button.disabled=false}};load();</script><script type="module" src="/js/pwa-init.js?v=53.3.0"></script></body></html>

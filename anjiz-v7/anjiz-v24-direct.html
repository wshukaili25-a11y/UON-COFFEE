<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5d3d"><title>ANJIZ Management System</title><style>body{margin:0;background:#0b5d3d;color:white;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.boot{text-align:center;padding:28px}.boot b{font-size:22px}.boot small{display:block;opacity:.78;margin-top:9px}</style></head><body><div class="boot"><b>ANJIZ Management System</b><small>Opening secure workspace…</small></div><script>(async()=>{const root='https://cdn.jsdelivr.net/gh/wshukaili25-a11y/UON-COFFEE@anjiz-system-v7/anjiz-v7/';async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.text()}async function unzip(b64){const bytes=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));if('DecompressionStream'in window)return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return new TextDecoder().decode(pako.ungzip(bytes))}const scanner=`<script>(function(){let qr=null;const LIB='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';function lib(){return new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();let s=document.getElementById('anjiz-ios-qr-lib');if(s){s.addEventListener('load',ok,{once:true});s.addEventListener('error',no,{once:true});return}s=document.createElement('script');s.id='anjiz-ios-qr-lib';s.src=LIB;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}function clean(raw){let v=String(raw||'').trim();try{let u=new URL(v,location.href);for(let k of ['uid','id','user','verify']){let x=u.searchParams.get(k);if(x)return x.toUpperCase()}}catch(e){}let m=v.match(/([A-Z]{1,4}\\d{2,12})/i);return (m?m[1]:v).toUpperCase()}async function stop(){let x=qr;qr=null;if(!x)return;try{if(x.isScanning)await x.stop()}catch(e){}try{await x.clear()}catch(e){}}window.stopAnjizIOSScanner=async()=>{await stop();try{closeModal()}catch(e){}};window.scanBarcodeToField=async function(fieldId){try{await lib()}catch(e){alert('QR scanner could not load. Check the connection and try again.');return}showModal('<h3>Scan Student ID / QR</h3><div class="notice">Allow camera access and point the camera at the ANJIZ QR code.</div><div id="anjizIOSReader" style="width:100%;min-height:280px;border-radius:14px;overflow:hidden;background:#071f17"></div><div class="row" style="margin-top:12px"><label class="btn secondary" style="cursor:pointer">Choose QR Image<input id="anjizIOSFile" type="file" accept="image/*" capture="environment" style="display:none"></label><button class="btn danger" onclick="stopAnjizIOSScanner()">Close</button></div>');const done=async raw=>{const val=clean(raw),t=document.getElementById(fieldId);await stop();closeModal();if(/^https?:\\/\\//i.test(String(raw))&&String(raw).includes(location.host)){location.href=String(raw);return}if(t){t.value=val;t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}));t.focus()}if(fieldId==='loginId'){let p=document.getElementById('loginPass');if(p)p.focus()}};try{qr=new Html5Qrcode('anjizIOSReader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},done,()=>{})}catch(e){let r=document.getElementById('anjizIOSReader');if(r)r.innerHTML='<div class="notice warn" style="margin:12px">Camera access unavailable. Use Choose QR Image below.</div>'}let f=document.getElementById('anjizIOSFile');if(f)f.onchange=async()=>{if(!f.files||!f.files[0])return;try{let temp=new Html5Qrcode('anjizIOSReader');let raw=await temp.scanFile(f.files[0],true);await done(raw)}catch(e){alert('No QR code was found in that image.')}}};window.scanLoginId=function(){return window.scanBarcodeToField('loginId')}})();<\/script>`;try{const parts=await Promise.all([1,2,3,4].map(i=>get(root+'p'+i+'.txt?v=20260901v24')));let h=await unzip(parts.join(''));h=h.replace('</body>',scanner+'</body>');document.open();document.write(h);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><b>ANJIZ could not open.</b><small>Please reload once or open this link in Safari.</small></div>'}})();</script></body></html>

"btn outline" onclick="openPage('others')">Administration</button></div>${pending.length?table(['Instructor','Day / Date','Time','Computers','Action'],pending.slice(0,5).map(x=>[esc(x.name),`${dayOf(x.date)}<br><span class="muted">${x.date}</span>`,x.time,x.count,`<div class="row"><button class="btn primary" onclick="approveComputer(${x.id},'Approved')">Approve</button><button class="btn danger" onclick="approveComputer(${x.id},'Rejected')">Reject</button></div>`])):'<div class="empty-state"><b>No pending requests</b><span>New computer booking requests will appear here.</span></div>'}</div><div class="panel"><div class="toolbar"><div><span class="section-label">ACTIVITY</span><h3>Recent Administrative Activity</h3></div><button class="btn outline" onclick="openNotifications()">Notifications</button></div>${(db.audit||[]).slice(0,6).map(x=>`<div class="activity-row"><span class="activity-dot"></span><div><b>${esc(x[2])}</b><small>${esc(x[1])} · ${esc(x[0])}</small></div></div>`).join('')||'<div class="empty-state"><b>No recent activity</b><span>Administrative actions will be recorded here.</span></div>'}</div></div>`}if(me.role==='instructor')return cards([['My appointments',a.length,'Assigned appointments'],['Conducted',a.filter(x=>x.status==='Conducted').length,'Completed'],['Referred students',db.referrals.length,'FI Advisory view'],['Computer requests',db.computerRequests.filter(x=>x.uid===me.uid).length,'Submitted']])+`<div class="grid2"><div class="panel"><h3>My Appointments</h3>${appointmentTable(a)}</div><div class="panel"><h3>Announcements</h3>${announcementList()}</div></div>`;if(me.role==='peer')return cards([['My appointments',a.length,'Assigned sessions'],['Conducted',a.filter(x=>x.status==='Conducted').length,'Completed'],['Availability',db.peerAvailability.filter(x=>x.uid===me.uid).length,'Submitted windows'],['Notifications',mineNotifs().filter(x=>!x.read).length,'Unread']])+`<div class="grid2"><div class="panel"><h3>My Appointments</h3>${appointmentT function bookingPage(){let choose=me.role!=='student',students=db.users.filter(x=>['Student','Visitor'].includes(x.role)&&x.active);return `<div class="grid2"><div class="panel"><h3>${me.role==='student'?'Book ANJIZ Services & Programs':'Book Appointment for Student'}</h3><div class="formgrid"><div class="field"><label>Student / Visitor</label>${choose?`<select id="bookStudent">${students.map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.uid)}${x.blocked?' · BLOCKED':''}</option>`).join('')}</select>`:`<input value="${esc(me.name)} · ${esc(me.uid)}" readonly><input id="bookStudent" type="hidden" value="${me.uid}">`}</div><div class="field"><label>Service / Program</label><select id="bookService" onchange="renderSlots()">${SERVICES.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="bookDate" type="date" value="2026-09-06" onchange="renderSlots()"></div><div class="field"><label>Admin manual assignment</label><select id="bookManual" ${me.role==='admin'?'':'disabled'}><option value="">Automatic assignment</option>${db.users.filter(x=>['Instructor','Peer-Tutor','Trainee'].includes(x.role)&&x.active).map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select></div></div><h4>Weekly Calendar · Select Date & Time</h4><div id="slotList" class="weekcal"></div><button class="btn primary" style="margin-top:11px" onclick="confirmBooking()">Confirm Appointment</button></div><div class="panel"><h3>Registration Rules</h3><div class="notice"><strong>English Remedial:</strong> two instructors can choose the same slot. First 5 students are assigned to the first instructor; remaining students go to the second. Admin can assign manually.</div><div class="notice"><strong>Math & DL:</strong> only one instructor can choose the same slot.</div><div class="notice"><strong>Conversation / Workshops / Reading Club / Edu-games:</strong> only one instructor can choose the same slot.</div><div class="notice"><strong>Peer tutorials:</strong> the system uses peer-tutor availability and Admin assignments.</div></div></div>`}
function slotCapacity(service,date,time){let rule=SERVICES.find(x=>x.id===service)?.rule;if(rule==='peer'){let available=db.peerAvailability.filter(x=>x.date===date&&time.slice(0,5)>=x.from&&time.slice(0,5)<x.to);return {ok:available.length>0,label:available.length?`${available.length} available`:'No peer available'}}let hours=db.instructorHours.filter(x=>x.service===service&&x.date===date&&x.time===time);if(!hours.length)return{ok:false,label:'No instructor hours'};let limit=rule==='two'?10:8,booked=db.appointments.filter(x=>x.service===service&&x.date===date&&x.time===time).length;return{ok:booked<limit,label:`${Math.max(0,limit-booked)} places`}}
function weekDates(date){let d=new Date((date||'2026-09-06')+'T12:00:00'),day=d.getDay(),sun=new Date(d);sun.setDate(d.getDate()-day);return Array.from({length:5},(_,i)=>{let x=new Date(sun);x.setDate(sun.getDate()+i);return{date:x.toISOString().slice(0,10),day:x.toLocaleDateString('en-US',{weekday:'short'}),n:x.getDate()}})}
function renderSlots(){selectedSlot='';let service=el('bookService')?.value||'eng',base=el('bookDate')?.value||'2026-09-06',days=weekDates(base),times=['09:00-09:45','10:00-10:45','11:00-11:45','12:00-12:45','13:00-13:45'],out=el('slotList');if(!out)return;let h=`<div class="wc-head">Time</div>${days.map(d=>`<div class="wc-head">${d.day}<b>${d.n}</b></div>`).join('')}`;let body=times.map(t=>`<div class="wc-time">${t}</div>${days.map(d=>{let c=slotCapacity(service,d.date,t);return `<button class="wc-slot ${c.ok?'':'full'}" ${c.ok?`onclick="selectSlot(this,'${d.date}','${t}')"`:'disabled'}><span>${c.ok?'Available':'Full'}</span><small>${c.label}</small></button>`}).join('')}`).join('');out.innerHTML=h+body}
function selectSlot(b,date,t){document.querySelectorAll('#slotList .wc-slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedSlot=t;el('bookDate').value=date}
function assignStaff(service,date,time,manual){if(manual)return user(manual);let rule=SERVICES.find(x=>x.id===service)?.rule;if(rule==='peer'){let assigned=db.peerAssignments.find(x=>x.service===service&&x.date===date&&x.time===time);if(assigned)return user(assigned.uid);let p=db.peerAvailability.find(x=>x.date===date&&time.slice(0,5)>=x.from&&time.slice(0,5)<x.to);return p?user(p.uid):null}let h=db.instructorHours.filter(x=>x.service===service&&x.date===date&&x.time===time);if(!h.length)return null;if(rule==='two'){let firstCount=db.appointments.filter(x=>x.service===service&&x.date===date&&x.time===time&&x.staffUid===h[0].uid).length;return user((firstCount<5||!h[1])?h[0].uid:h[1].uid)}return user(h[0].uid)}
function confirmBooking(){if(!selectedSlot)return alert('Select an available time.');let s=user(el('bookStudent').value);if(!s)return;if(s.blocked)return alert(`This student is blocked. ${s.blockDay||''} ${s.blockDate||''}. Reason: ${s.reason}`);let service=el('bookService').value,date=el('bookDate').value,staff=assignStaff(service,date,selectedSlot,el('bookManual')?.value||'');if(!staff)return alert('No available staff for this slot.');db.appointments.push({id:Date.now(),studentUid:s.uid,student:s.name,level:s.level||'—',service,serviceName:svc(service),date,day:dayOf(date),time:selectedSlot,staffUid:staff.uid,staff:staff.name,status:'Confirmed',attendance:'Upcoming',bookedBy:me.sub});pushNotif(s.uid,'Appointment confirmed',`${svc(service)} · ${date} ${selectedSlot} · ${staff.name}`);pushNotif(staff.uid,'New ANJIZ appointment',`${s.name} · ${svc(service)} · ${date} ${selectedSlot}`);queueEmail(s.email,'ANJIZ Appointment Confirmation',`Your ANJIZ appointment is confirmed: ${svc(service)}, ${dayOf(date)} ${date}, ${selectedSlot}. Assigned: ${staff.name}.`);save();audit(`Booked ${s.name} / ${svc(service)}`);openPage('appointments')}
function markAppointment(id,attendance){let a=db.appointments.find(x=>x.id===id);if(!a)return;a.status='Conducted';a.attendance=attendance;let stu=user(a.studentUid);pushNotif(a.studentUid,'ANJIZ attendance updated',`${a.serviceName} · ${a.day||dayOf(a.date)} ${a.date} · ${attendance}`);if(stu?.email)queueEmail(stu.email,'ANJIZ Attendance Update',`Your ANJIZ session ${a.serviceName} on ${a.day||dayOf(a.date)} ${a.date} was recorded as ${attendance}.`);save();audit(`Appointment ${id} conducted · ${attendance}`);openPage('appointments')}
function attendancePage(){if(me.role==='admin')return adminAttendance();return staffAttendance()}

function adminAttendance(){let rows=db.attendance.map(x=>{let apps=db.appointments.filter(a=>a.staffUid===x.uid||a.studentUid===x.uid),programs=[...new Set(apps.map(a=>a.serviceName))].join(', ')||'—';return[esc(x.name),esc(x.role),`${esc(x.day)}<br><span class="muted">${esc(x.date)}</span>`,esc(x.login),esc(x.logout),`${apps.length} appointment(s)<br><span class="muted">${esc(programs)}</span>`,statusBadge(x.status),x.status!=='On time'?`<div class="row"><button class="btn amber" onclick="openAttendanceAction(${x.id})">Supervisor Action</button><button class="btn outline" onclick="sendAttendanceToFI(${x.id})">Send to FI</button></div>`:'—']});return `<div class="grid2"><div class="panel"><div class="toolbar"><div><h3>Attendance / Login & Logout</h3><div class="muted">Users, their appointments/programs, login/logout times, dates and days.</div></div><div class="row"><button class="btn primary" onclick="openUserCheck()">User Check-In / Out</button><button class="btn secondary" onclick="openAbsenceCheck()">Run Absence Check</button><button class="btn secondary" onclick="exportAttendance()">Export Excel</button><button class="btn outline" onclick="prepareEmail('ANJIZ Attendance Report',attendanceText())">Email Report</button></div></div>${table(['User','Type','Day / Date','Login','Logout','Programs / Appointments','Status','Action'],rows)}</div><div class="panel"><h3>Categorization Report</h3>${['Instructor','Peer-Tutor','Trainee','Visitor','Student'].map(r=>`<div class="notice"><div class="toolbar" style="margin:0"><span>${r}</span><b>${db.users.filter(x=>x.role===r).length}</b></div></div>`).join('')}<div class="notice"><div class="toolbar" style="margin:0"><span>Students with disabilities</span><b>${db.users.filter(x=>x.disability).length} ★</b></div></div><div class="notice"><div class="toolbar" style="margin:0"><span>Blocked students</span><b>${db.users.filter(x=>x.blocked).length}</b></div></div></div></div>`}
function openAttendanceAction(id){let x=db.attendance.find(a=>a.id===id);if(!x)return;showModal(`<h3>Supervisor Action · ${esc(x.name)}</h3><div class="notice"><b>${esc(x.status)}</b> · ${esc(x.day)} ${esc(x.date)} · Login ${esc(x.login)} · Logout ${esc(x.logout)}</div><div class="field"><label>Supervisor Comment / Note</label><textarea id="supervisorComment" rows="5">${esc(x.supervisorComment||'')}</textarea></div><div class="row"><button class="btn primary" onclick="saveSupervisorComment(${id},true)">Save & Email User</button><button class="btn secondary" onclick="saveSupervisorComment(${id},false)">Save Only</button><button class="btn outline" onclick="closeModal()">Cancel</button></div>`)}
function saveSupervisorComment(id,emailUser){let x=db.attendance.find(a=>a.id===id),comment=el('supervisorComment').value.trim();x.supervisorComment=comment;let u=user(x.uid);if(emailUser&&u?.email){queueEmail(u.email,'ANJIZ Supervisor Attendance Comment',`Attendance case: ${x.status} on ${x.day} ${x.date}. Supervisor comment: ${comment}`);prepareEmail('ANJIZ Supervisor Attendance Comment',`Attendance case: ${x.status} on ${x.day} ${x.date}. Supervisor comment: ${comment}`,u.email)}save();audit(`Supervisor comment for ${x.uid}`);closeModal();openPage('attendance')}
function sendAttendanceToFI(id){let x=db.attendance.find(a=>a.id===id);if(!x)return;prepareEmail(`ANJIZ ${x.status} Attendance Report`,`${x.name} (${x.role}) · ${x.day} ${x.date}\nLogin: ${x.login}\nLogout: ${x.logout}\nStatus: ${x.status}\nNote: ${x.note||'—'}\nSupervisor comment: ${x.supervisorComment||'—'}`,db.settings.fiEmail)}
function staffAttendance(){let mine=db.attendance.filter(x=>x.uid===me.uid);return `<div class="grid2"><div class="panel"><h3>Personal Barcode · Sign In / Out</h3><div id="attendanceBarcode" class="barcode"></div><div class="row" style="margin-top:10px;justify-content:center"><button class="btn primary" onclick="staffSign('in')">Sign In</button><button class="btn outline" onclick="staffSign('out')">Sign Out</button></div><p class="muted" style="text-align:center">Personal ANJIZ barcode for instructors, peer-tutors and trainees.</p></div><div class="panel"><h3>My Login / Logout History</h3>${table(['Day / Date','Login','Logout','Status','Supervisor comment'],mine.map(x=>[`${x.day}<br><span class="muted">${x.date}</span>`,x.login,x.logout,statusBadge(x.status),esc(x.supervisorComment||'—')]))}</div></div>`}
function scheduledDutyStart(uid,date){let starts=[];db.instructorHours.filter(x=>x.uid===uid&&x.date===date).forEach(x=>starts.push(String(x.time||'').split('-')[0]));db.peerAssignments.filter(x=>x.uid===uid&&x.date===date).forEach(x=>starts.push(String(x.time||'').split('-')[0]));starts=starts.filter(Boolean).sort();return starts[0]||db.settings.lateAfter}
function timeToMin(t){let m=String(t||'00:00').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):0}
function staffSign(type){let d=new Date(),date=localDateISO(d),time=localTimeHM(d),day=d.toLocaleDateString('en-US',{weekday:'long'}),r=db.attendance.find(x=>x.uid===me.uid&&x.date===date);if(type==='in'){if(!r){let expected=scheduledDutyStart(me.uid,date),status=timeToMin(time)>timeToMin(expected)?'Late':'On time';r={id:Date.now(),uid:me.uid,name:me.name,role:me.sub,date,day,login:time,logout:'—',status,note:status==='Late'?`Scheduled ${expected}; signed in ${time}`:'',supervisorComment:''};db.attendance.push(r);if(status==='Late'){pushNotif('admin','Late attendance',`${me.name} signed in late on ${day} ${date} at ${time}. Scheduled start: ${expected}.`);queueEmail(db.settings.supervisorEmail,'ANJIZ Late Attendance Alert',`${me.name} signed in late on ${day} ${date} at ${time}. Scheduled ANJIZ start: ${expected}.`)}}else r.login=time}else{if(r)r.logout=time;else db.attendance.push({id:Date.now(),uid:me.uid,name:me.name,role:me.sub,date,day,login:'—',logout:time,status:'On time',note:'',supervisorComment:''})}save();audit(`Attendance ${type}`);openPage('attendance')}
function localDateISO(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`}
function localTimeHM(d=new Date()){return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function reportPreset(period){let end=new Date(),start=new Date(end);if(period==='Weekly')start.setDate(end.getDate()-6);else if(period==='Monthly')start=new Date(end.getFullYear(),end.getMonth(),1);else if(period==='Annual')start=new Date(end.getFullYear(),0,1);return{from:localDateISO(start),to:localDateISO(end)}}
function reportsPage(){let d=reportPreset('Monthly');return `<div class="panel"><div class="toolbar"><div><h3>${me.role==='admin'?'ANJIZ Reports':'My ANJIZ Reports'}</h3><div class="muted">Weekly, monthly, annual or custom From / To. Conducted appointments include days and dates.</div></div><div class="row"><button class="btn secondary" onclick="exportCurrentReport()">Export Excel (.xlsx)</button><button class="btn outline" onclick="prepareEmail('ANJIZ Report',currentReportText())">Send by Email</button></div></div><div class="formgrid"><div class="field"><label>Period</label><select id="reportPeriod" onchange="applyPeriodPreset()"><option>Weekly</option><option selected>Monthly</option><option>Annual</option><option>Custom</option></select></div><div class="field"><label>Range Summary</label><input id="reportRangeSummary" value="${d.from} → ${d.to}" readonly></div><div class="field"><label>From</label><input id="reportFrom" type="date" value="${d.from}" onchange="setCustomRange()"></div><div class="field"><label>To</label><input id="reportTo" type="date" value="${d.to}" onchange="setCustomRange()"></div></div>${me.role==='admin'?`<div class="tabs"><button id="tabUsers" class="active" onclick="setReportTab('users')">Users Report</button><button id="tabCourses" onclick="setReportTab('courses')">ANJIZ Courses Report</button><button id="tabLevels" onclick="setReportTab('levels')">ANJIZ Level Report</button></div>`:''}<div id="reportBody">${reportBody()}</div></div>`}
function range(){return{from:el('reportFrom')?.value||'0000-01-01',to:el('reportTo')?.value||'9999-12-31'}}function inRange(d){let r=range();return d>=r.from&&d<=r.to}function conductedFor(uid){return db.appointments.filter(a=>inRange(a.date)&&a.status==='Conducted'&&(a.studentUid===uid||a.staffUid===uid))}function reportBody(){if(me.role==='admin'&&reportTab==='courses')return coursesReport();if(me.role==='admin'&&reportTab==='levels')return levelReport();let users=me.role==='admin'?db.users.filter(x=>x.role!=='Admin'):[user(me.uid)].filter(Boolean);return table(['User','Type','No. Conducted','Conducted Days & Dates','Special Status'],users.map(u=>{let c=conductedFor(u.uid),dates=c.map(a=>`${a.day||dayOf(a.date)} ${a.date}`).join('<br>')||'—',special=u.disability?'★ Student with disability':u.blocked?`BLOCKED · ${u.blockDay||dayOf(u.blockDate)} ${u.blockDate}<br>Reason: ${esc(u.reason)}`:'—';return[esc(u.name),esc(u.role),c.length,dates,special]}),r=>r[4].includes('BLOCKED')?'blocked':r[4].includes('★')?'star':'')}
function coursesReport(){let rows=SERVICES.map(s=>{let a=db.appointments.filter(x=>inRange(x.date)&&x.service===s.id);return[esc(s.name),a.length,a.filter(x=>x.status==='Conducted').length,a.filter(x=>x.attendance==='Present').length,a.filter(x=>x.attendance==='Absent').length]});return table(['Course / Program','Appointments','Conducted','Present','Absent'],rows)}function levelReport(){let levels=['Level 1','Level 2','Level 3','Other'];return table(['Level','Students','Appointments','Conducted','Present'],levels.map(l=>{let us=db.users.filter(x=>(x.level||'Other')===l),a=db.appointments.filter(x=>inRange(x.date)&&us.some(u=>u.uid===x.studentUid));return[l,us.length,a.length,a.filter(x=>x.status==='Conducted').length,a.filter(x=>x.attendance==='Present').length]}))}

function openUserCheck(){showModal(`<h3>User / Visitor Check-In & Out</h3><div class="notice">Use University ID for visitors or as a supervised fallback. Instructors, peer-tutors and trainees also retain their personal barcode sign-in/out.</div><div class="field"><label>University ID / Verified User ID</label><input id="checkUserId" placeholder="e.g. V001"></div><div class="row"><button class="btn secondary" onclick="scanBarcodeToField('checkUserId')">Scan Barcode</button><button class="btn primary" onclick="adminUserCheck('in')">Check In</button><button class="btn outline" onclick="adminUserCheck('out')">Check Out</button><button class="btn outline" onclick="closeModal()">Cancel</button></div>`)}
function adminUserCheck(type){let id=el('checkUserId').value.trim().toLowerCase(),uu=db.users.find(x=>x.uid.toLowerCase()===id||String(x.email||'').toLowerCase()===id);if(!uu)return alert('Verified user not found.');let d=new Date(),date=d.toISOString().slice(0,10),time=d.toTimeString().slice(0,5),day=d.toLocaleDateString('en-US',{weekday:'long'}),r=db.attendance.find(x=>x.uid===uu.uid&&x.date===date);if(type==='in'){if(!r){r={id:Date.now(),uid:uu.uid,name:uu.name,role:uu.role,date,day,login:time,logout:'—',status:'On time',note:'Admin supervised check-in',supervisorComment:''};db.attendance.push(r)}else r.login=time}else{if(!r){r={id:Date.now(),uid:uu.uid,name:uu.name,role:uu.role,date,day,login:'—',logout:time,status:'On time',note:'Admin supervised check-out',supervisorComment:''};db.attendance.push(r)}else r.logout=time}save();audit(`Admin ${type==='in'?'check-in':'check-out'} ${uu.uid}`);closeModal();openPage('attendance')}
function openAbsenceCheck(){showModal(`<h3>Attendance Absence Check</h3><div class="notice">Checks registered FI instructor hours and Admin peer-tutorial assignments against sign-in records. Missing required sign-ins are recorded as Absent and an email notification is queued for ANJIZ Supervisor.</div><div class="field"><label>Date to check</label><input id="absenceDate" type="date" value="2026-08-30"></div><div class="row"><button class="btn primary" onclick="runAbsenceCheck()">Check & Record Absences</button><button class="btn outline" onclick="closeModal()">Cancel</button></div>`)}
function runAbsenceCheck(){let date=el('absenceDate').value;if(!date)return;let expected=[];db.instructorHours.filter(x=>x.date===date).forEach(x=>expected.push({uid:x.uid,name:x.name,role:'Instructor',source:`${svc(x.service)} · ${x.time}`}));db.peerAssignments.filter(x=>x.date===date).forEach(x=>expected.push({uid:x.uid,name:x.name,role:user(x.uid)?.role||'Peer-Tutor',source:`Peer-tutorials · ${x.time}`}));let created=0;expected.forEach(x=>{if(db.attendance.some(a=>a.uid===x.uid&&a.date===date))return;db.attendance.push({id:Date.now()+Math.random(),uid:x.uid,name:x.name,role:x.role,date,day:dayOf(date),login:'—',logout:'—',status:'Absent',note:`No sign-in for scheduled ANJIZ duty: ${x.source}`,supervisorComment:''});pushNotif('admin','Absent attendance',`${x.name} has no sign-in record for ${dayOf(date)} ${date}. ${x.source}`);queueEmail(db.settings.supervisorEmail,'ANJIZ Absence Alert',`${x.name} has no sign-in record for ${dayOf(date)} ${date}. Scheduled duty: ${x.source}.`);created++});save();audit(`Absence check ${date} · ${created} new case(s)`);closeModal();alert(`${created} new absence case(s) recorded.`);openPage('attendance')}
function dutyEnd(time){let p=String(time||'').split('-');return p[1]||p[0]||'23:59'}
function expectedDuties(date){let out=[];db.instructorHours.filter(x=>x.date===date).forEach(x=>out.push({uid:x.uid,name:x.name,role:'Instructor',time:x.time,source:`${svc(x.service)} · ${x.time}`}));db.peerAssignments.filter(x=>x.date===date).forEach(x=>out.push({uid:x.uid,name:x.name,role:user(x.uid)?.role||'Peer-Tutor',time:x.time,source:`Peer-tutorials · ${x.time}`}));return out}
function reconcileDueAttendance(){ensureV6();let now=new Date(),today=localDateISO(now),nowMin=timeToMin(localTimeHM(now)),created=0;let dates=[today];let y=new Date(now);y.setDate(y.getDate()-1);dates.push(localDateISO(y));dates.forEach(date=>expectedDuties(date).forEach(x=>{if(db.attendance.some(a=>a.uid===x.uid&&a.date===date))return;let due=date<today||nowMin>timeToMin(dutyEnd(x.time));if(!due)return;db.attendance.push({id:Date.now()+Math.random(),uid:x.uid,name:x.name,role:x.role,date,day:dayOf(date),login:'—',logout:'—',status:'Absent',note:`No sign-in for scheduled ANJIZ duty: ${x.source}`,supervisorComment:''});pushNotif('admin','Absent attendance',`${x.name} has no sign-in record for ${dayOf(date)} ${date}. ${x.source}`);queueEmail(db.settings.supervisorEmail,'ANJIZ Absence Alert',`${x.name} has no sign-in record for ${dayOf(date)} ${date}. Scheduled duty: ${x.source}.`);created++}));if(created){save();audit(`Automatic attendance reconciliation · ${created} absence case(s)`)}}

function setReportTab(t){reportTab=t;['Users','Courses','Levels'].forEach(x=>el('tab'+x)?.classList.toggle('active',x.toLowerCase()===t));refreshReports()}function refreshReports(){let b=el('reportBody');if(b)b.innerHTML=reportBody()}function applyPeriodPreset(){let p=el('reportPeriod').value;if(p==='Custom')return refreshReports();let d=reportPreset(p);el('reportFrom').value=d.from;el('reportTo').value=d.to;let s=el('reportRangeSummary');if(s)s.value=`${d.from} → ${d.to}`;refreshReports()}
function setCustomRange(){let p=el('reportPeriod');if(p)p.value='Custom';let r=range(),s=el('reportRangeSummary');if(s)s.value=`${r.from} → ${r.to}`;refreshReports()}
function othersPage(){if(me.role!=='admin')return `<div class="grid2">${timetablePage()}<div class="panel"><h3>ANJIZ Announcements</h3>${announcementList()}</div></div>`;return `<div class="panel"><h3>Others</h3><div class="muted" style="margin-bottom:12px">The requirements specify four items in Admin “Others”.</div><div class="module-grid"><div class="module" onclick="openOther('survey')"><b>ANJIZ Survey</b><span>Publish or view the approved ANJIZ survey.</span></div><div class="module" onclick="openOther('rules')"><b>Rules & Regulations</b><span>Upload / maintain approved ANJIZ rules and regulations.</span></div><div class="module" onclick="openOther('timetable')"><b>ANJIZ Timetable</b><span>Upload timetable for each cycle and notify users.</span></div><div class="module" onclick="openOther('announcements')"><b>Announcements</b><span>Publish announcements and email notifications.</span></div></div></div>`}
function openOther(type){if(type==='survey')showModal(`<h3>ANJIZ Survey</h3><div class="notice">The source file specifies ANJIZ Survey but does not provide the final survey URL/form.</div><div class="field"><label>Approved Survey URL</label><input id="surveyUrl" value="${esc(db.surveyUrl)}" placeholder="https://..."></div><div class="row"><button class="btn primary" onclick="db.surveyUrl=el('surveyUrl').value.trim();save();closeModal()">Save</button>${db.surveyUrl?`<button class="btn outline" onclick="window.open('${esc(db.surveyUrl)}','_blank')">Open Survey</button>`:''}</div>`);if(type==='rules')showModal(`<h3>Rules & Regulations</h3><div class="notice">The requirements file names this section but does not include the final policy text.</div><div class="field"><textarea id="rulesText" rows="12">${esc(db.rulesText)}</textarea></div><button class="btn primary" onclick="db.rulesText=el('rulesText').value;save();closeModal()">Save Rules</button>`);if(type==='timetable')showModal(`<h3>ANJIZ Timetable · Cycles</h3>${cycleManager()}<div class="row" style="margin-top:11px"><button class="btn primary" onclick="showTimetableUpload()">Upload New Cycle</button><button class="btn outline" onclick="closeModal()">Close</button></div>`);if(type==='announcements')showModal(`<h3>Announcements</h3>${announcementList()}<h4>Publish New Announcement</h4><div class="field"><label>Title</label><input id="annTitle"></div><div class="field"><label>Message</label><textarea id="annBody" rows="4"></textarea></div><div class="field"><label>Audience</label><select id="annAudience"><option>All users</option><option>FI students</option><option>Instructors</option><option>Peer-Tutors and Trainees</option></select></div><button class="btn primary" onclick="publishAnnouncement()">Publish & Queue Email Notifications</button>`)}
function registrationPage(){return `<div class="grid2"><div class="panel"><h3>Automated Registration for FI Instructors</h3><div class="notice"><strong>English:</strong> maximum 2 instructors per slot. <strong>Math & DL / Conversation / Workshops / Reading Club / Edu-games:</strong> maximum 1 instructor per slot.</div><div class="formgrid"><div class="field"><label>Instructor</label><select id="regInstructor">${db.users.filter(x=>x.role==='Instructor'&&x.active).map(x=>`<option value="${x.uid}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Program</label><select id="regService">${SERVICES.filter(x=>x.rule!=='peer').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="regDate" type="date" value="2026-09-09"></div><div class="field"><label>Time</label><select id="regTime"><option>09:00-09:45</option><option>10:00-10:45</option><option>11:00-11:45</option><option>12:00-12:45</option></select></div></div><button class="btn primary" onclick="adminRegisterInstructor()">Register Instructor Hour</button><h4>Registered Instructor Hours</h4>${table(['Instructor','Program','Day / Date','Time'],db.instructorHours.map(x=>[esc(x.name),esc(svc(x.service)),`${x.day}<br><span class="muted">${x.date}</span>`,x.time]))}<h4>Weekly Instructor Calendar</h4>${registrationCalendar()}<h4>English Student Distribution</h4>${englishDistribution()}</div><div class="panel"><h3>Peer-Tutorial Assignment</h3><div class="notice">Admin can choose peer-tutor names for a program. The booking system then uses the available/assigned peer-tutor.</div><div class="formgrid"><div class="field"><label>Peer-Tutor / Trainee</label><select id="peerAssignUid">${db.users.filter(x=>['Peer-Tutor','Trainee'].includes(x.role)&&x.active).map(x=>`<option value="${x.uid}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="peerAssignDate" type="date" value="2026-09-06"></div><div class="field"><label>Time</label><select id="peerAssignTime"><option>09:00-09:45</option><option selected>10:00-10:45</option><option>11:00-11:45</option></select></div></div><button class="btn primary" onclick="savePeerAssignment()">Assign Peer-Tutor</button><h4>Availability</h4>${table(['Peer-Tutor / Trainee','Date','Day','From','To'],db.peerAvailability.map(x=>[esc(x.name),x.date,x.day,x.from,x.to]))}<h4>Admin Assignments</h4>${table(['Name','Date','Time'],db.peerAssignments.map(x=>[esc(x.name),x.date,x.time]))}</div></div><div class="panel" style="margin-top:12px"><div class="toolbar"><div><h3>Admin User Verification · Excel / CSV</h3><div class="muted">Verify users, emails and extensions; record instructor and peer-tutor names. Admin controls each user's role.</div></div><button class="btn secondary" onclick="downloadUserTemplate()">Download Template</button></div><div class="formgrid"><div class="field"><label>Verification File</label><input id="verifyFile" type="file" accept=".csv,.xlsx,.xls"></div><div class="field"><label>Supported Import Format</label><input value="XLSX / XLS / CSV: ID, Name, Email, Extension, Role, Level" readonly></div></div><div class="row"><button class="btn primary" onclick="importVerificationFile()">Verify & Import</button><span id="verifyResult" class="muted"></span></div><h4>Verified Users & Roles</h4>${table(['Name / ID','Email / Ext.','Role','Status','Special','Actions'],db.users.map((u,i)=>[`${esc(u.name)}<br><span class="muted">${esc(u.uid)}</span>`,`${esc(u.email||'—')}<br><span class="muted">${esc(u.ext||'—')}</span>`,`<select onchange="changeRole(${i},this.value)" ${u.uid==='A001'?'disabled':''}>${['Admin','Instructor','Student','Visitor','Peer-Tutor','Trainee'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`,statusBadge(u.active?'Active':'Inactive'),u.disability?'★ Disability':u.blocked?`Blocked · ${esc(u.reason||'')}`:'—',u.uid==='A001'?'—':`<div class="row"><button class="btn outline" onclick="toggleUserActive(${i})">${u.active?'Disable':'Enable'}</button>${['Student','Visitor'].includes(u.role)?`<button class="btn secondary" onclick="toggleDisability(${i})">★</button><button class="btn danger" onclick="toggleBlocked(${i})">${u.blocked?'Unblock':'Block'}</button>`:''}</div>`]),r=>r[4].includes('Blocked')?'blocked':r[4].includes('★')?'star':'')}</div>`}
function adminRegisterInstructor(){let uid=el('regInstructor').value,service=el('regService').value,date=el('regDate').value,time=el('regTime').value,rule=SERVICES.find(x=>x.id===service).rule,existing=db.instructorHours.filter(x=>x.service===service&&x.date===date&&x.time===time);if(rule==='one'&&existing.length)return alert('This slot already has an instructor.');if(rule==='two'&&existing.length>=2)return alert('This English slot already has two instructors.');let uu=user(uid);db.instructorHours.push({uid,name:uu.name,service,date,day:dayOf(date),time});save();audit(`Registered ${uu.name} ANJIZ hour`);openPage('registration')}
function savePeerAssignment(){let uid=el('peerAssignUid').value,date=el('peerAssignDate').value,time=el('peerAssignTime').value,available=db.peerAvailability.some(x=>x.uid===uid&&x.date===date&&time.slice(0,5)>=x.from&&time.slice(0,5)<x.to);if(!available&&!confirm('This user has no matching availability for this time. Assign anyway?'))return;let uu=user(uid),old=db.peerAssignments.find(x=>x.date===date&&x.time===time);if(old){old.uid=uid;old.name=uu.name}else db.peerAssignments.push({uid,name:uu.name,service:'peer',date,time});save();audit(`Assigned ${uu.name} to peer tutorials`);openPage('registration')}

function registrationCalendar(){let dates=weekDates('2026-09-06'),times=['09:00-09:45','10:00-10:45','11:00-11:45','12:00-12:45'];return `<div class="weekcal readonly"><div class="wc-head">Time</div>${dates.map(d=>`<div class="wc-head">${d.day}<b>${d.n}</b></div>`).join('')}${times.map(t=>`<div class="wc-time">${t}</div>${dates.map(d=>{let h=db.instructorHours.filter(x=>x.date===d.date&&x.time===t);return `<div class="wc-info ${h.length?'filled':''}">${h.map(x=>`<b>${esc(x.name)}</b><small>${esc(svc(x.service))}</small>`).join('')||'<small>Open</small>'}</div>`}).join('')}`).join('')}</div>`}
function englishDistribution(){let rows=db.appointments.filter(x=>x.service==='eng').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||String(a.level).localeCompare(String(b.level)));return table(['Student','Level','Day / Date','Time','Assigned Instructor','Manual'],rows.map(a=>[esc(a.student),esc(a.level||'—'),`${esc(a.day||dayOf(a.date))}<br><span class="muted">${esc(a.date)}</span>`,esc(a.time),esc(a.staff),`<button class="btn outline" onclick="reassignEnglish(${a.id})">Reassign</button>`]))}
function reassignEnglish(id){let a=db.appointments.find(x=>x.id===id);if(!a)return;let candidates=db.instructorHours.filter(x=>x.service==='eng'&&x.date===a.date&&x.time===a.time);if(!candidates.length)return alert('No English instructors registered for this slot.');showModal(`<h3>Manual English Assignment</h3><div class="notice">${esc(a.student)} · ${esc(a.level||'—')} · ${esc(a.date)} ${esc(a.time)}</div><div class="field"><label>Instructor</label><select id="reassignEnglishUid">${candidates.map(x=>`<option value="${x.uid}" ${x.uid===a.staffUid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="row"><button class="btn primary" onclick="saveEnglishReassign(${id})">Save Assignment</button><button class="btn outline" onclick="closeModal()">Cancel</button></div>`)}
function saveEnglishReassign(id){let a=db.appointments.find(x=>x.id===id),uu=user(el('reassignEnglishUid').value);if(!a||!uu)return;a.staffUid=uu.uid;a.staff=uu.name;pushNotif(a.studentUid,'ANJIZ appointment assignment updated',`${a.serviceName} · ${a.date} ${a.time} · ${uu.name}`);save();audit(`Manual English assignment ${a.studentUid} -> ${uu.uid}`);closeModal();openPage('registration')}
function toggleUserActive(i){db.users[i].active=!db.users[i].active;save();audit(`${db.users[i].active?'Enabled':'Disabled'} ${db.users[i].uid}`);openPage('registration')}
function toggleDisability(i){db.users[i].disability=!db.users[i].disability;save();audit(`Disability marker ${db.users[i].uid}: ${db.users[i].disability}`);openPage('registration')}
function toggleBlocked(i){let u=db.users[i];if(u.blocked){u.blocked=false;u.reason='';u.blockDate='';u.blockDay=''}else{let reason=prompt('Reason for blocking this student:','Repeated no-show');if(!reason)return;u.blocked=true;u.reason=reason;u.blockDate=new Date().toISOString().slice(0,10);u.blockDay=dayOf(u.blockDate)}save();audit(`${u.blocked?'Blocked':'Unblocked'} ${u.uid}`);openPage('registration')}

function approveComputer(id,status){let x=db.computerRequests.find(r=>r.id===id);if(!x)return;x.status=status;x.note=prompt('Supervisor note (optional):','')||'';let uu=user(x.uid);pushNotif(x.uid,`ANJIZ Computer Request ${status}`,`${x.date} ${x.time} · ${x.count} computers. ${x.note}`);queueEmail(uu?.email,`ANJIZ Computer Request ${status}`,`Your ANJIZ computer request for ${dayOf(x.date)} ${x.date}, ${x.time}, is ${status}. Supervisor note: ${x.note||'—'}`);save();audit(`${status} ANJIZ computer request`);openPage('dashboard')}
function changeRole(i,role){db.users[i].role=role;save();audit(`Changed ${db.users[i].uid} role to ${role}`);openPage('registration')}
function downloadUserTemplate(){exportExcel('ANJIZ_User_Verification_Template',['ID','Name','Email','Extension','Role','Level'],[['I200','Example Instructor','instructor@example.edu','2100','Instructor',''],['P300','Example Peer Tutor','peer@example.edu','2200','Peer-Tutor',''],['S300','Example Student','student@example.edu','','Student','Level 1']])}
async function importVerificationFile(){let f=el('verifyFile').files[0];if(!f)return alert('Choose a verification file.');let rows=[];try{if(/\.csv$/i.test(f.name)){rows=parseCSV(await f.text())}else if(/\.xlsx?$/i.test(f.name)){await loadXLSX();let buf=await f.arrayBuffer(),wb=XLSX.read(buf),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}else return alert('Use CSV, XLSX or XLS.')}catch(err){el('verifyResult').textContent='Could not read this Excel file. Try CSV or check the file format.';return}let added=0,updated=0;rows.forEach(r=>{let uid=String(r.ID||r.Id||r.id||'').trim(),name=String(r.Name||r.name||'').trim();if(!uid||!name)return;let existing=user(uid),role=String(r.Role||r.role||'Student').trim();if(existing){existing.name=name;existing.email=String(r.Email||r.email||existing.email||'').trim();existing.ext=String(r.Extension||r.Ext||r.extension||existing.ext||'').trim();existing.role=role||existing.role;existing.level=String(r.Level||r.level||existing.level||'').trim();existing.active=true;updated++}else{db.users.push({uid,name,email:String(r.Email||r.email||'').trim(),ext:String(r.Extension||r.Ext||r.extension||'').trim(),role,level:String(r.Level||r.level||'').trim(),active:true});added++}});save();audit(`Verified user file ${f.name}`);el('verifyResult').textContent=`Verified ${rows.length} rows · ${added} added · ${updated} updated`;setTimeout(()=>openPage('registration'),700)}
function computersPage(){let mine=db.computerRequests.filter(x=>x.uid===me.uid);return `<div class="grid2"><div class="panel"><h3>Book ANJIZ Computers</h3><p class="muted">Choose day/time and send the request to ANJIZ Supervisor for approval.</p><div class="formgrid"><div class="field"><label>Date</label><input id="compDate" type="date" value="2026-09-03"></div><div class="field"><label>Time</label><input id="compTime" value="11:00-12:00"></div><div class="field"><label>No. Computers</label><input id="compCount" type="number" min="1" value="8"></div><div class="field"><label>Purpose</label><input id="compPurpose" value="ANJIZ support session"></div></div><button class="btn primary" onclick="submitComputerRequest()">Send Request to Supervisor</button></div><div class="panel"><h3>My Requests</h3>${table(['Date','Time','Computers','Status','Supervisor Note'],mine.map(x=>[x.date,x.time,x.count,statusBadge(x.status),esc(x.note||'—')]))}</div></div>`}
function submitComputerRequest(){db.computerRequests.push({id:Date.now(),uid:me.uid,name:me.name,date:el('compDate').value,time:el('compTime').value,count:+el('compCount').value,purpose:el('compPurpose').value,status:'Pending',note:''});pushNotif('admin','ANJIZ Computer Request',`${me.name} requested ANJIZ computers for ${el('compDate').value} ${el('compTime').value}.`);queueEmail(db.settings.supervisorEmail,'ANJIZ Computer Booking Request',`${me.name} requested ${el('compCount').value} computers on ${el('compDate').value} ${el('compTime').value}.`);save();audit('Submitted ANJIZ computer request');openPage('computers')}
function referredPage(){return `<div class="panel"><h3>Referred Students</h3><div class="notice"><strong>FI Advisory System:</strong> the requirements require this page to be linked to FI Advisory System. FI Advisory integration is prepared for CIS configuration. This review version displays the required ANJIZ attendance and appointment view.</div>${table(['Student','Level','FI Advisor','Appointments','Present','Absent','Details'],db.referrals.map(x=>[esc(x.student),x.level,x.advisor,x.appointments,x.present,x.absent,`<button class="btn outline" onclick="showReferral('${x.uid}')">View Details</button>`]))}</div>`}
function showReferral(uid){let r=db.referrals.find(x=>x.uid===uid),apps=db.appointments.filter(x=>x.studentUid===uid);if(!r)return;showModal(`<h3>Referred Student · ${esc(r.student)}</h3><div class="cards"><div class="card"><small>Appointments</small><strong>${r.appointments}</strong></div><div class="card"><small>Present</small><strong>${r.present}</strong></div><div class="card"><small>Absent</small><strong>${r.absent}</strong></div><div class="card"><small>Level</small><strong style="font-size:18px">${esc(r.level)}</strong></div></div><div style="margin-top:12px">${appointmentTable(apps)}</div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="closeModal()">Close</button></div>`)}

let appointmentViewState={month:'',date:'',service:'all',status:'all',search:''};
function apEnsureState(){
  const all=myAppointments().slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const today=localDateISO();
  if(!appointmentViewState.date){
    const todayHas=all.some(x=>x.date===today);
    const next=all.find(x=>x.date>=today)||all[0];
    appointmentViewState.date=todayHas?today:(next?.date||today);
  }
  if(!appointmentViewState.month)appointmentViewState.month=appointmentViewState.date.slice(0,7);
}

  apEnsureState();
  const q=(appointmentViewState.search||'').trim().toLowerCase();
  return myAppointments().filter(x=>
    (appointmentViewState.service==='all'||x.service===appointmentViewState.service)&&
    (appointmentViewState.status==='all'||x.status===appointmentViewState.status)&&
    (!q||[x.student,x.serviceName,x.staff,x.studentUid,x.bookedBy].some(v=>String(v||'').toLowerCase().includes(q)))
  ).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

  apEnsureState();const arr=apFiltered(),[y,m]=appointmentViewState.month.split('-').map(Number),first=new Date(y,m-1,1),count=new Date(y,m,0).getDate(),offset=first.getDay(),today=localDateISO();
  let cells='';for(let i=0;i<offset;i++)cells+='<div class="cal-cell cal-empty"></div>';
  for(let day=1;day<=count;day++){
    const date=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,items=arr.filter(x=>x.date===date),selected=date===appointmentViewState.date;
    const services=[...new Set(items.map(x=>x.service))].slice(0,3);
    cells+=`<button class="cal-cell ${items.length?'has-events':''} ${selected?'selected':''} ${date===today?'today':''}" onclick="apSelectDate('${date}')"><span class="cal-day">${day}</span>${items.length?`<b class="cal-count">${items.length}</b><div class="cal-dots">${services.map(()=>'<i></i>').join('')}</div>`:''}</button>`;
  }
  return `<div class="calendar-shell"><div class="calendar-head"><button class="cal-nav" onclick="apShiftMonth(-1)" aria-label="Previous month">‹</button><div><span class="section-label">MONTH VIEW</span><h3>${apMonthLabel(appointmentViewState.month)}</h3></div><button class="cal-nav" onclick="apShiftMonth(1)" aria-label="Next month">›</button></div><div class="cal-weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells}</div></div>`
}
function apDayView(){
  apEnsureState();const date=appointmentViewState.date,items=apFiltered().filter(x=>x.date===date).sort((a,b)=>a.time.localeCompare(b.time));
  return `<div class="day-shell"><div class="toolbar"><div><span class="section-label">DAY VIEW</span><h3>${dayOf(date)} · ${date}</h3></div><span class="day-total">${items.length} appointment${items.length===1?'':'s'}</span></div><div class="day-list">${items.length?items.map(a=>{let su=user(a.studentUid),canMark=['admin','instructor','peer'].includes(me.role);return `<article class="day-appt"><div class="time-rail"><b>${esc(a.time.split('-')[0])}</b><span>${esc(a.time.split('-')[1]||'')}</span></div><div class="appt-body"><div class="appt-title"><div><b>${esc(a.student)}${su?.disability?' ★':''}</b><span>${esc(a.serviceName)}</span></div>${statusBadge(a.status)}</div><div class="appt-meta"><span>Assigned: <b>${esc(a.staff)}</b></span><span>Attendance: ${statusBadge(a.attendance)}</span></div><div class="appt-actions"><button class="btn outline" onclick="showAppointmentDetails(${a.id})">Details</button>${canMark&&a.status!=='Conducted'?`<button class="btn secondary" onclick="markAppointment(${a.id},'Present')">Present</button><button class="btn danger" onclick="markAppointment(${a.id},'Absent')">Absent</button>`:''}</div></div></article>`}).join(''):`<div class="empty-state"><b>No appointments on this day</b><span>Select another date from the calendar or create a new booking.</span>${['admin','peer','student'].includes(me.role)?'<button class="btn primary" onclick="openPage(\'book\')">New booking</button>':''}</div>`}</div></div>`
}
function apListTable(arr){
  return table(['Student','Service','Day / Date','Time','Assigned','Status','Attendance',''],arr.map(a=>{let su=user(a.studentUid);return[`${esc(a.student)}${su?.disability?' ★':''}`,esc(a.serviceName),`${esc(a.day||dayOf(a.date))}<br><span class="muted">${esc(a.date)}</span>`,esc(a.time),esc(a.staff),statusBadge(a.status),statusBadge(a.attendance),`<button class="btn outline" onclick="showAppointmentDetails(${a.id})">Details</button>`]}),r=>r[0].includes('★')?'star':'')
}
function showAppointmentDetails(id){
  const a=db.appointments.find(x=>x.id===id);if(!a)return;const su=user(a.studentUid),staff=user(a.staffUid),canMark=['admin','instructor','peer'].includes(me.role);
  showModal(`<div class="appt-modal-head"><div><span class="section-label">ANJIZ APPOINTMENT</span><h3>${esc(a.serviceName)}</h3></div>${statusBadge(a.status)}</div><div class="detail-grid"><div><small>Student / Visitor</small><b>${esc(a.student)}${su?.disability?' ★':''}</b><span>${esc(a.studentUid)}</span></div><div><small>Day & Date</small><b>${esc(a.day||dayOf(a.date))}</b><span>${esc(a.date)}</span></div><div><small>Time</small><b>${esc(a.time)}</b></div><div><small>Assigned Staff</small><b>${esc(a.staff)}</b><span>${esc(staff?.role||'')}</span></div><div><small>Attendance</small>${statusBadge(a.attendance)}</div><div><small>Booked By</small><b>${esc(a.bookedBy||'—')}</b></div></div><div class="row" style="margin-top:16px"><button class="btn outline" onclick="closeModal()">Close</button>${canMark&&a.status!=='Conducted'?`<button class="btn secondary" onclick="closeModal();markAppointment(${a.id},'Present')">Mark Present</button><button class="btn danger" onclick="closeModal();markAppointment(${a.id},'Absent')">Mark Absent</button>`:''}</div>`)
}
function appointmentsPage(){
  apEnsureState();const arr=apFiltered(),conducted=arr.filter(x=>x.status==='Conducted').length,present=arr.filter(x=>x.attendance==='Present').length,upcoming=arr.filter(x=>x.status!=='Conducted').length;
  const serviceOptions=SERVICES.map(s=>`<option value="${s.id}" ${appointmentViewState.service===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  return `<div class="appt-page-head"><div><span class="section-label">SCHEDULING & ATTENDANCE</span><h3>${me.role==='admin'?'ANJIZ Appointments':'My ANJIZ Appointments'}</h3><p>Calendar, day schedule and appointment records in one view.</p></div><div class="row">${['admin','peer','student'].includes(me.role)?'<button class="btn primary" onclick="openPage(\'book\')">＋ New booking</button>':''}<button class="btn outline" onclick="exportAppointments()">Export Excel</button></div></div>${cards([['Filtered appointments',arr.length,'Current view'],['Upcoming',upcoming,'Not yet conducted'],['Conducted',conducted,'Completed sessions'],['Present',present,'Attendance recorded']])}<div class="panel appt-filter-panel"><div class="appt-filters"><div class="field"><label>Service / Program</label><select onchange="apSetService(this.value)"><option value="all">All services</option>${serviceOptions}</select></div><div class="field"><label>Status</label><select onchange="apSetStatus(this.value)"><option value="all" ${appointmentViewState.status==='all'?'selected':''}>All statuses</option><option value="Confirmed" ${appointmentViewState.status==='Confirmed'?'selected':''}>Confirmed</option><option value="Conducted" ${appointmentViewState.status==='Conducted'?'selected':''}>Conducted</option></select></div><div class="field ap-search"><label>Search</label><div class="search-inline"><input value="${esc(appointmentViewState.search)}" placeholder="Student, ID, staff…" onkeydown="if(event.key==='Enter')apSetSearch(this.value)"><button class="btn outline" onclick="apSetSearch(this.previousElementSibling.value)">Search</button></div></div><div class="field"><label>Calendar</label><button class="btn outline full" onclick="apGoToday()">Today</button></div></div></div><div class="appt-layout"><div class="panel ap-calendar-panel">${apCalendar()}</div><div class="panel ap-day-panel">${apDayView()}</div></div><div class="panel" style="margin-top:12px"><div class="toolbar"><div><span class="section-label">ALL RECORDS</span><h3>Appointment List</h3></div><span class="muted">${arr.length} result${arr.length===1?'':'s'}</span></div>${arr.length?apListTable(arr):'<div class="empty-state"><b>No appointments match these filters</b><span>Clear or change the filters to view more records.</span></div>'}</div>`
}


</script>
<script data-anjiz-module="booking">
var bookingStateV10={service:'eng',date:'',time:'',manual:'',reviewed:false};
function bookingRuleTextV10(id){let r=SERVICES.find(x=>x.id===id)?.rule;return r==='two'?'Up to 2 instructors · 5 students per first instructor':r==='peer'?'Peer availability / Admin assignment':'Single instructor per registered slot'}
function bookingServiceIconV10(id){return({eng:'EN',math:'M',conv:'CO',work:'WS',read:'RC',games:'EG',peer:'PT'})[id]||'A'}
function bookingEligibleStaffV10(service,date,time){let rule=SERVICES.find(x=>x.id===service)?.rule;if(rule==='peer'){let ids=[];db.peerAssignments.filter(x=>x.date===date&&x.time===time).forEach(x=>ids.push(x.uid));db.peerAvailability.filter(x=>x.date===date&&time&&time.slice(0,5)>=x.from&&time.slice(0,5)<x.to).forEach(x=>ids.push(x.uid));return [...new Set(ids)].map(user).filter(Boolean)}return db.instructorHours.filter(x=>x.service===service&&x.date===date&&x.time===time).map(x=>user(x.uid)).filter(Boolean)}
function bookingFirstAvailableDateV10(service){let today=localDateISO(),dates=[];let rule=SERVICES.find(x=>x.id===service)?.rule;if(rule==='peer')db.peerAvailability.forEach(x=>{if(x.date>=today)dates.push(x.date)});else db.instructorHours.filter(x=>x.service===service).forEach(x=>{if(x.date>=today)dates.push(x.date)});dates.sort();return dates[0]||today}
function bookingStudentV10(){return user(el('bookStudent')?.value||me.uid)}
function bookingConflictV10(uid,date,time){return db.appointments.find(x=>x.studentUid===uid&&x.date===date&&x.time===time&&x.status!=='Cancelled')}
function bookingSummaryV10(){let box=el('bookingSummaryV10');if(!box)return;let s=bookingStudentV10(),service=el('bookService')?.value||bookingStateV10.service,date=el('bookDate')?.value||bookingStateV10.date,time=selectedSlot||'',manual=el('bookManual')?.value||'',staff=time?assignStaff(service,date,time,manual):null,conf=s&&date&&time?bookingConflictV10(s.uid,date,time):null,blocked=!!s?.blocked;let warning=blocked?`<div class="booking-alert danger"><b>Booking blocked</b><span>${esc(s.reason||'This user is blocked from booking.')}${s.blockDate?` · ${esc(s.blockDate)}`:''}</span></div>`:conf?`<div class="booking-alert danger"><b>Schedule conflict</b><span>${esc(s.name)} already has an appointment at this time.</span></div>`:time&&!staff?`<div class="booking-alert warn"><b>Assignment unavailable</b><span>No eligible staff member is available for the selected slot.</span></div>`:'';box.innerHTML=`${warning}<div class="booking-summary-row"><span>Student / Visitor</span><b>${s?esc(s.name):'—'}</b><small>${s?esc(s.uid):''}</small></div><div class="booking-summary-row"><span>Service / Program</span><b>${esc(svc(service))}</b><small>${esc(bookingRuleTextV10(service))}</small></div><div class="booking-summary-row"><span>Appointment</span><b>${date&&time?`${esc(dayOf(date))} · ${esc(date)}`:'Select a date and time'}</b><small>${time?esc(time):'No slot selected'}</small></div><div class="booking-summary-row"><span>Assigned staff</span><b>${staff?esc(staff.name):'Automatic after slot selection'}</b><small>${staff?esc(staff.role||staff.sub||'ANJIZ Staff'):'Based on registered availability'}</small></div><div class="booking-summary-row"><span>Booked by</span><b>${esc(me.name)}</b><small>${esc(me.sub)}</small></div><button class="btn primary booking-confirm-main" ${(!time||blocked||conf||!staff)?'disabled':''} onclick="confirmBooking()">Review & Confirm</button>`}
function bookingUpdateManualV10(){let sel=el('bookManual');if(!sel||me.role!=='admin')return;let service=el('bookService')?.value||'eng',date=el('bookDate')?.value||'',time=selectedSlot||'',current=sel.value,staff=bookingEligibleStaffV10(service,date,time);sel.innerHTML=`<option value="">Automatic assignment</option>${staff.map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.role||'Staff')}</option>`).join('')}`;if(staff.some(x=>x.uid===current))sel.value=current}
window.selectBookingServiceV10=function(id){bookingStateV10.service=id;selectedSlot='';let hidden=el('bookService');if(hidden)hidden.value=id;document.querySelectorAll('.booking-service-card').forEach(x=>x.classList.toggle('active',x.dataset.service===id));let d=bookingFirstAvailableDateV10(id),date=el('bookDate');if(date)date.value=d;renderSlots();bookingSummaryV10()}
window.bookingStudentChangedV10=function(){selectedSlot='';renderSlots();bookingSummaryV10()}
window.bookingDateChangedV10=function(){selectedSlot='';renderSlots();bookingSummaryV10()}
bookingPage=function(){let choose=['admin','peer','trainee'].includes(me.role),students=db.users.filter(x=>['Student','Visitor'].includes(x.role)&&x.active),service=bookingStateV10.service||'eng',date=bookingFirstAvailableDateV10(service);bookingStateV10.date=date;return `<div class="booking-v10"><div class="booking-hero"><div><span class="booking-kicker">ANJIZ APPOINTMENT</span><h3>${me.role==='student'?'Book a Service or Program':'Book for Student / Visitor'}</h3><p>Choose the student, service and an available ANJIZ slot. Assignment rules are applied automatically.</p></div><div class="booking-steps"><span class="active">1 Student</span><span>2 Service</span><span>3 Slot</span><span>4 Review</span></div></div><div class="booking-layout"><div class="booking-main"><div class="panel booking-section"><div class="booking-section-head"><span>01</span><div><h3>${choose?'Student / Visitor':'Your booking'}</h3><p>${choose?'Select the verified person receiving the service.':'Your University ID is used for this appointment.'}</p></div></div>${choose?`<div class="field"><label>Verified Student / Visitor</label><select id="bookStudent" onchange="bookingStudentChangedV10()">${students.map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.uid)}${x.blocked?' · BLOCKED':''}</option>`).join('')}</select></div>`:`<div class="booking-person"><div class="booking-avatar">${esc((me.name||'S').slice(0,1))}</div><div><b>${esc(me.name)}</b><span>${esc(me.uid)} · ${esc(me.sub)}</span></div></div><input id="bookStudent" type="hidden" value="${me.uid}">`}</div><div class="panel booking-section"><div class="booking-section-head"><span>02</span><div><h3>Service / Program</h3><p>Select the ANJIZ service required for this appointment.</p></div></div><input type="hidden" id="bookService" value="${service}"><div class="booking-services">${SERVICES.map(x=>`<button class="booking-service-card ${x.id===service?'active':''}" data-service="${x.id}" onclick="selectBookingServiceV10('${x.id}')"><i>${bookingServiceIconV10(x.id)}</i><b>${esc(x.name)}</b><small>${esc(bookingRuleTextV10(x.id))}</small></button>`).join('')}</div></div><div class="panel booking-section"><div class="booking-section-head"><span>03</span><div><h3>Date & Time</h3><p>Only registered and available ANJIZ hours can be selected.</p></div></div><div class="booking-datebar"><div class="field"><label>Week containing</label><input id="bookDate" type="date" value="${date}" onchange="bookingDateChangedV10()"></div><div class="booking-legend"><span><i class="open"></i>Available</span><span><i class="selected"></i>Selected</span><span><i class="closed"></i>Unavailable</span></div></div><div id="slotList" class="weekcal booking-weekcal"></div>${me.role==='admin'?`<div class="booking-manual"><div><b>Admin assignment override</b><span>Optional. Eligible staff for the selected slot only.</span></div><select id="bookManual" onchange="bookingSummaryV10()"><option value="">Automatic assignment</option></select></div>`:`<input id="bookManual" type="hidden" value="">`}</div></div><aside class="booking-side"><div class="panel booking-summary-card"><span class="booking-kicker">BOOKING SUMMARY</span><h3>Review appointment</h3><div id="bookingSummaryV10"></div></div><div class="panel booking-policy"><h3>Assignment rules</h3><div><b>English Remedial</b><span>Maximum two instructors in one slot. First five students go to the first instructor, remaining students to the second.</span></div><div><b>Math & DL / ANJIZ programs</b><span>One registered instructor per slot.</span></div><div><b>Peer Tutorials</b><span>Uses Peer-Tutor availability and Admin assignments.</span></div></div></aside></div></div>`}
renderSlots=function(){selectedSlot='';let service=el('bookService')?.value||bookingStateV10.service||'eng',base=el('bookDate')?.value||bookingFirstAvailableDateV10(service),days=weekDates(base),times=['09:00-09:45','10:00-10:45','11:00-11:45','12:00-12:45','13:00-13:45'],out=el('slotList');if(!out)return;let h=`<div class="wc-head time-head">Time</div>${days.map(d=>`<div class="wc-head"><span>${d.day}</span><b>${d.n}</b></div>`).join('')}`;let body=times.map(t=>`<div class="wc-time">${t}</div>${days.map(d=>{let c=slotCapacity(service,d.date,t),staff=c.ok?assignStaff(service,d.date,t,''):null;return `<button class="wc-slot ${c.ok?'':'full'}" ${c.ok?`onclick="selectSlot(this,'${d.date}','${t}')"`:'disabled'}><span>${c.ok?'Available':'Unavailable'}</span><small>${esc(c.label)}</small>${staff?`<em>${esc(staff.name)}</em>`:''}</button>`}).join('')}`).join('');out.innerHTML=h+body;bookingUpdateManualV10();bookingSummaryV10()}
selectSlot=function(b,date,t){document.querySelectorAll('#slotList .wc-slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedSlot=t;bookingStateV10.date=date;bookingStateV10.time=t;let d=el('bookDate');if(d)d.value=date;bookingUpdateManualV10();bookingSummaryV10();document.querySelectorAll('.booking-steps span').forEach((x,i)=>x.classList.toggle('active',i<=2))}
confirmBooking=function(){if(!selectedSlot)return alert('Select an available time.');let s=bookingStudentV10();if(!s)return alert('Select a verified student or visitor.');if(s.blocked)return alert(`This student is blocked. ${s.blockDay||''} ${s.blockDate||''}. Reason: ${s.reason||'—'}`);let service=el('bookService').value,date=el('bookDate').value,manual=el('bookManual')?.value||'',staff=assignStaff(service,date,selectedSlot,manual),conf=bookingConflictV10(s.uid,date,selectedSlot);if(conf)return alert('This student already has an appointment at the selected time.');let cap=slotCapacity(service,date,selectedSlot);if(!cap.ok)return alert('This slot is no longer available. Select another time.');if(!staff)return alert('No available staff for this slot.');showModal(`<div class="booking-review-modal"><span class="booking-kicker">FINAL REVIEW</span><h3>Confirm ANJIZ Appointment</h3><div class="booking-review-grid"><div><span>Student / Visitor</span><b>${esc(s.name)}</b><small>${esc(s.uid)} · ${esc(s.level||s.role||'')}</small></div><div><span>Service / Program</span><b>${esc(svc(service))}</b><small>${esc(bookingRuleTextV10(service))}</small></div><div><span>Date & Time</span><b>${esc(dayOf(date))} · ${esc(date)}</b><small>${esc(selectedSlot)}</small></div><div><span>Assigned staff</span><b>${esc(staff.name)}</b><small>${manual?'Manual Admin assignment':'Automatic assignment'}</small></div></div><div class="booking-review-note">The appointment will be recorded as <b>Confirmed</b> and notifications will be prepared for the student and assigned ANJIZ staff member.</div><div class="row"><button class="btn primary" onclick="commitBookingV10()">Confirm Appointment</button><button class="btn outline" onclick="closeModal()">Back</button></div></div>`)}
window.commitBookingV10=function(){let s=bookingStudentV10(),service=el('bookService').value,date=el('bookDate').value,manual=el('bookManual')?.value||'',staff=assignStaff(service,date,selectedSlot,manual);if(!s||!staff||!selectedSlot)return closeModal();if(bookingConflictV10(s.uid,date,selectedSlot)){closeModal();return alert('This student now has a conflicting appointment. Refresh and select another slot.')}let cap=slotCapacity(service,date,selectedSlot);if(!cap.ok){closeModal();return alert('This slot is no longer available. Refresh and select another time.')}db.appointments.push({id:Date.now(),studentUid:s.uid,student:s.name,level:s.level||'—',service,serviceName:svc(service),date,day:dayOf(date),time:selectedSlot,staffUid:staff.uid,staff:staff.name,status:'Confirmed',attendance:'Upcoming',bookedBy:me.sub});pushNotif(s.uid,'Appointment confirmed',`${svc(service)} · ${date} ${selectedSlot} · ${staff.name}`);pushNotif(staff.uid,'New ANJIZ appointment',`${s.name} · ${svc(service)} · ${date} ${selectedSlot}`);queueEmail(s.email,'ANJIZ Appointment Confirmation',`Your ANJIZ appointment is confirmed: ${svc(service)}, ${dayOf(date)} ${date}, ${selectedSlot}. Assigned: ${staff.name}.`);save();audit(`Booked ${s.name} / ${svc(service)}`);closeModal();selectedSlot='';openPage('appointments')}

</script>
<script data-anjiz-module="attendance">
var attendanceStateV11={date:'',role:'all',status:'all',search:''};
function attEnsureStateV11(){if(!attendanceStateV11.date)attendanceStateV11.date=localDateISO()}
function attRecordRoleV11(x){return x.role||user(x.uid)?.role||'User'}
function attFilteredV11(){attEnsureStateV11();let q=(attendanceStateV11.search||'').trim().toLowerCase();return db.attendance.filter(x=>(!attendanceStateV11.date||x.date===attendanceStateV11.date)&&(attendanceStateV11.role==='all'||attRecordRoleV11(x)===attendanceStateV11.role)&&(attendanceStateV11.status==='all'||x.status===attendanceStateV11.status)&&(!q||[x.name,x.uid,attRecordRoleV11(x),x.note,x.supervisorComment].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>String(a.login||'99:99').localeCompare(String(b.login||'99:99')))}
function attRefreshV11(){if(el('content'))el('content').innerHTML=attendancePage()}
function attSetRoleV11(v){attendanceStateV11.role=v;attRefreshV11()}
function attSetStatusV11(v){attendanceStateV11.status=v;attRefreshV11()}
function attSetSearchV11(v){attendanceStateV11.search=v;attRefreshV11()}
function attSetDateV11(v){attendanceStateV11.date=v||localDateISO();attRefreshV11()}
function attShiftDateV11(delta){attEnsureStateV11();let d=new Date(attendanceStateV11.date+'T12:00:00');d.setDate(d.getDate()+delta);attendanceStateV11.date=localDateISO(d);attRefreshV11()}
function attGoTodayV11(){attendanceStateV11.date=localDateISO();attRefreshV11()}
function attDurationV11(x){if(!x.login||x.login==='—')return'—';let end=x.logout&&x.logout!=='—'?x.logout:localTimeHM();let m=Math.max(0,timeToMin(end)-timeToMin(x.login)),h=Math.floor(m/60),n=m%60;return h?`${h}h ${n}m`:`${n}m`}
function attProgramsV11(uid,date){let apps=db.appointments.filter(a=>(a.staffUid===uid||a.studentUid===uid)&&(!date||a.date===date));return [...new Set(apps.map(a=>a.serviceName))].filter(Boolean)}
function attOpenRecordV11(id){let x=db.attendance.find(a=>a.id===id);if(!x)return;let u=user(x.uid),programs=attProgramsV11(x.uid,x.date);showModal(`<div class="att-modal-head"><div><span class="att-kicker">ATTENDANCE RECORD</span><h3>${esc(x.name)}</h3><p>${esc(x.uid)} · ${esc(attRecordRoleV11(x))}</p></div>${statusBadge(x.status)}</div><div class="att-detail-grid"><div><small>Day & Date</small><b>${esc(x.day||dayOf(x.date))}</b><span>${esc(x.date)}</span></div><div><small>Login / Logout</small><b>${esc(x.login)} → ${esc(x.logout)}</b><span>${esc(attDurationV11(x))}</span></div><div><small>Programs</small><b>${esc(programs.join(', ')||'—')}</b></div><div><small>Account</small><b>${esc(u?.email||'—')}</b><span>${u?.blocked?'Blocked user':u?.active===false?'Inactive':'Active'}</span></div></div>${x.note?`<div class="att-note"><b>System note</b><span>${esc(x.note)}</span></div>`:''}${x.supervisorComment?`<div class="att-note"><b>Supervisor comment</b><span>${esc(x.supervisorComment)}</span></div>`:''}<div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeModal();openAttendanceAction(${x.id})">Supervisor Action</button>${x.status!=='On time'?`<button class="btn outline" onclick="closeModal();sendAttendanceToFI(${x.id})">Prepare FI Email</button>`:''}<button class="btn outline" onclick="closeModal()">Close</button></div>`)}

function adminAttendanceV11(){attEnsureStateV11();let date=attendanceStateV11.date,allDate=db.attendance.filter(x=>x.date===date),arr=attFilteredV11(),inside=allDate.filter(x=>x.login&&x.login!=='—'&&(!x.logout||x.logout==='—')).length,late=allDate.filter(x=>x.status==='Late').length,absent=allDate.filter(x=>x.status==='Absent').length,onTime=allDate.filter(x=>x.status==='On time').length,expected=typeof expectedDuties==='function'?expectedDuties(date):[];let roleOptions=['Instructor','Peer-Tutor','Trainee','Visitor','Student'].map(r=>`<option value="${r}" ${attendanceStateV11.role===r?'selected':''}>${r}</option>`).join('');return `<div class="att-page"><div class="att-hero"><div><span class="att-kicker">LIVE ATTENDANCE OPERATIONS</span><h3>ANJIZ Attendance & Categorization</h3><p>Check-in/out, presence, lateness, absence, programs and user categories in one supervisor view.</p></div><div class="row"><button class="btn primary" onclick="openUserCheck()">＋ User Check-In / Out</button><button class="btn secondary" onclick="openAbsenceCheck()">Run Absence Check</button></div></div><div class="att-metrics"><div><small>In ANJIZ now</small><b>${inside}</b><span>Currently checked in</span></div><div><small>On time</small><b>${onTime}</b><span>${esc(date)}</span></div><div class="warn"><small>Late</small><b>${late}</b><span>Supervisor review</span></div><div class="danger"><small>Absent</small><b>${absent}</b><span>Recorded cases</span></div><div><small>Expected duties</small><b>${expected.length}</b><span>Registered schedule</span></div></div><div class="panel att-filter-panel"><div class="att-date-nav"><button class="att-day-btn" onclick="attShiftDateV11(-1)">‹</button><div><span>VIEWING DATE</span><b>${esc(dayOf(date))} · ${esc(date)}</b></div><button class="att-day-btn" onclick="attShiftDateV11(1)">›</button><button class="btn outline" onclick="attGoTodayV11()">Today</button></div><div class="att-filters"><div class="field"><label>User category</label><select onchange="attSetRoleV11(this.value)"><option value="all">All categories</option>${roleOptions}</select></div><div class="field"><label>Status</label><select onchange="attSetStatusV11(this.value)"><option value="all">All statuses</option>${['On time','Late','Absent'].map(s=>`<option value="${s}" ${attendanceStateV11.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field att-search"><label>Search</label><div class="search-inline"><input value="${esc(attendanceStateV11.search)}" placeholder="Name, ID, note…" onkeydown="if(event.key==='Enter')attSetSearchV11(this.value)"><button class="btn outline" onclick="attSetSearchV11(this.previousElementSibling.value)">Search</button></div></div><div class="field"><label>Date</label><input type="date" value="${esc(date)}" onchange="attSetDateV11(this.value)"></div></div></div><div class="att-grid"><div class="panel"><div class="toolbar"><div><span class="att-kicker">LIVE PRESENCE</span><h3>Who's in ANJIZ Now</h3></div><span class="att-pill">${inside} inside</span></div><div class="att-people">${attWhoIsInV11(allDate)}</div></div><div class="panel"><div class="toolbar"><div><span class="att-kicker">SUPERVISOR QUEUE</span><h3>Late & Absent</h3></div><span class="att-pill danger">${late+absent} cases</span></div><div class="att-cases">${attQueueV11(allDate)}</div></div></div><div class="panel att-timeline-panel"><div class="toolbar"><div><span class="att-kicker">DAY TIMELINE</span><h3>${esc(dayOf(date))} Attendance Timeline</h3></div><div class="row"><button class="btn secondary" onclick="exportAttendance()">Export Excel</button><button class="btn outline" onclick="prepareEmail('ANJIZ Attendance Report',attendanceText())">Email Report</button></div></div>${attTimelineV11(arr)}</div><div class="panel"><div class="toolbar"><div><span class="att-kicker">CATEGORIZATION</span><h3>ANJIZ User Categories</h3></div><span class="muted">Verified system users</span></div>${attCategoryV11()}</div></div>`}

function attQrUrlV24(uid){let u=new URL(location.origin+location.pathname);u.searchParams.set('attendance',uid);u.searchParams.set('v','24');return u.toString()}
function attQrImageV24(uid){let data=encodeURIComponent(attQrUrlV24(uid));return `https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=12&data=${data}`}
function attQrStatusV24(uid){let today=localDateISO(),r=db.attendance.find(x=>x.uid===uid&&x.date===today);if(!r)return'Not checked in';if(r.login&&r.login!=='—'&&(!r.logout||r.logout==='—'))return`Inside since ${r.login}`;if(r.logout&&r.logout!=='—')return`Checked out ${r.logout}`;return r.status||'Pending'}
function staffAttendanceV11(){let mine=db.attendance.filter(x=>x.uid===me.uid).sort((a,b)=>b.date.localeCompare(a.date)),today=localDateISO(),todayRec=mine.find(x=>x.date===today),duties=(typeof expectedDuties==='function'?expectedDuties(today):[]).filter(x=>x.uid===me.uid),expected=scheduledDutyStart(me.uid,today),qr=attQrImageV24(me.uid);return `<div class="att-page"><div class="att-hero"><div><span class="att-kicker">PERSONAL ATTENDANCE</span><h3>My ANJIZ Attendance</h3><p>Scan your attendance QR with any phone camera, then confirm Sign In / Sign Out.</p></div>${todayRec?statusBadge(todayRec.status):'<span class="att-pill">Not signed in</span>'}</div><div class="att-metrics staff"><div><small>Today's status</small><b>${esc(todayRec?.status||'—')}</b><span>${esc(today)}</span></div><div><small>Expected start</small><b>${esc(expected||'—')}</b><span>Registered duty</span></div><div><small>Login</small><b>${esc(todayRec?.login||'—')}</b><span>${todayRec?esc(attDurationV11(todayRec)):'No session yet'}</span></div><div><small>Scheduled duties</small><b>${duties.length}</b><span>${duties.map(x=>esc(x.time)).join(', ')||'None today'}</span></div></div><div class="att-grid staff"><div class="panel att-barcode-card"><span class="att-kicker">ATTENDANCE QR</span><h3>Scan to Sign In / Out</h3><div id="attendanceBarcode" style="display:none"></div><div style="display:grid;place-items:center;padding:14px"><img src="${qr}" alt="ANJIZ attendance QR for ${esc(me.uid)}" width="250" height="250" style="max-width:78vw;width:250px;height:250px;background:#fff;padding:10px;border-radius:18px;border:1px solid #dce9e2" referrerpolicy="no-referrer"></div><div style="text-align:center;margin-bottom:10px"><b>${esc(me.name)}</b><div class="muted">${esc(me.uid)} · ${esc(me.role||me.sub||'ANJIZ Staff')}</div><div class="att-pill" style="display:inline-block;margin-top:8px">${esc(attQrStatusV24(me.uid))}</div></div><div class="row att-sign-actions"><button class="btn primary" onclick="staffSign('in')">Sign In</button><button class="btn outline" onclick="staffSign('out')">Sign Out</button></div><p class="muted">Use the phone camera on the QR above. It opens the ANJIZ attendance confirmation page directly — no file upload or barcode scanner is required.</p></div><div class="panel"><span class="att-kicker">TODAY</span><h3>Duty & Status</h3>${duties.length?duties.map(x=>`<div class="att-duty"><b>${esc(x.source)}</b><span>${esc(x.time)} · ${esc(dayOf(today))} ${esc(today)}</span></div>`).join(''):'<div class="att-empty compact"><b>No registered ANJIZ duty today</b><span>Your next duty will appear when published.</span></div>'}${todayRec?`<div class="att-note"><b>${esc(todayRec.status)}</b><span>Login ${esc(todayRec.login)} · Logout ${esc(todayRec.logout)}${todayRec.supervisorComment?` · ${esc(todayRec.supervisorComment)}`:''}</span></div>`:''}</div></div><div class="panel"><div class="toolbar"><div><span class="att-kicker">HISTORY</span><h3>Login / Logout Timeline</h3></div><span class="muted">${mine.length} records</span></div>${mine.length?`<div class="att-history">${mine.map(x=>`<div><span>${esc(x.day||dayOf(x.date))}<small>${esc(x.date)}</small></span><b>${esc(x.login)} → ${esc(x.logout)}</b>${statusBadge(x.status)}<em>${esc(x.supervisorComment||x.note||'')}</em></div>`).join('')}</div>`:'<div class="att-empty"><b>No attendance history yet</b><span>Your ANJIZ sign-in records will appear here.</span></div>'}</div></div>`}
attendancePage=function(){return me.role==='admin'?adminAttendanceV11():staffAttendanceV11()};

function attQrOverlayV24(uid){let u=user(uid);if(!u)return;let today=localDateISO(),r=db.attendance.find(x=>x.uid===uid&&x.date===today),inside=!!(r&&r.login&&r.login!=='—'&&(!r.logout||r.logout==='—'));let old=document.getElementById('anjizAttendanceQrOverlayV24');if(old)old.remove();let d=document.createElement('div');d.id='anjizAttendanceQrOverlayV24';d.style.cssText='position:fixed;inset:0;z-index:999999;background:linear-gradient(160deg,#073b29,#0b5d3d);display:grid;place-items:center;padding:20px;font-family:system-ui';d.innerHTML=`<div style="width:min(520px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 80px #0005;color:#173c2d"><div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#0b6b49">ANJIZ ATTENDANCE</div><h2 style="margin:7px 0 3px">${esc(u.name)}</h2><div style="color:#718077;font-size:13px">${esc(u.uid)} · ${esc(u.role||u.sub||'User')}</div><div style="margin:18px 0;padding:14px;border-radius:14px;background:#f2f8f5"><small style="display:block;color:#718077">Today · ${esc(today)}</small><b style="display:block;margin-top:4px;font-size:17px">${esc(attQrStatusV24(uid))}</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button onclick="attQrCommitV24('${esc(uid)}','in')" style="border:0;border-radius:13px;padding:14px;background:#0b5d3d;color:white;font-weight:800;font-size:15px">Sign In</button><button onclick="attQrCommitV24('${esc(uid)}','out')" style="border:1px solid #bfd3c9;border-radius:13px;padding:14px;background:#fff;color:#0b5d3d;font-weight:800;font-size:15px">Sign Out</button></div><p style="margin:14px 0 0;color:#718077;font-size:11px;line-height:1.5">Attendance review environment. CIS can connect the same QR flow to the University attendance database for centralized production records.</p></div>`;document.body.appendChild(d)}
function attQrCommitV24(uid,mode){let u=user(uid);if(!u)return;let today=localDateISO(),now=localTimeHM(),r=db.attendance.find(x=>x.uid===uid&&x.date===today);if(mode==='in'){let expected=typeof scheduledDutyStart==='function'?scheduledDutyStart(uid,today):null,status=expected&&timeToMin(now)>timeToMin(expected)?'Late':'On time';if(!r){r={id:typeof nextId==='function'?nextId(db.attendance):Date.now(),uid:u.uid,name:u.name,role:u.role||u.sub||'User',date:today,day:dayOf(today),login:now,logout:'—',status,note:'QR attendance check-in'};db.attendance.push(r)}else{r.login=now;r.logout='—';r.status=status;r.note='QR attendance check-in'};if(typeof audit==='function')audit(`QR attendance check-in ${u.uid}`)}else{if(!r||!r.login||r.login==='—'){alert('No active check-in was found for today.');return}r.logout=now;r.note='QR attendance check-out';if(typeof audit==='function')audit(`QR attendance check-out ${u.uid}`)}save();attQrOverlayV24(uid)}
(function attQrDeepLinkBootV24(){let p=new URLSearchParams(location.search),uid=p.get('attendance');if(!uid)return;let run=()=>{try{attQrOverlayV24(uid)}catch(e){console.warn('ANJIZ attendance QR unavailable',e)}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,900),{once:true});else setTimeout(run,900)})();

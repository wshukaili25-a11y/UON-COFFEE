<script data-anjiz-module="reports-core">
var reportRangeStateV12={period:'Monthly',...reportPreset('Monthly')};
function reportRangeV12(){return{from:el('reportFrom')?.value||reportRangeStateV12.from,to:el('reportTo')?.value||reportRangeStateV12.to}}
function reportInRangeV12(date){let r=reportRangeV12();return String(date||'')>=r.from&&String(date||'')<=r.to}
function reportAppointmentsV12(){return db.appointments.filter(x=>reportInRangeV12(x.date))}
function reportAttendanceRowsV12(){return db.attendance.filter(x=>reportInRangeV12(x.date))}
function reportUsersV12(){return me.role==='admin'?db.users.filter(x=>x.role!=='Admin'):[user(me.uid)].filter(Boolean)}
function reportLevelsV12(){let a=db.users.filter(x=>x.role==='Student').map(x=>x.level||'Other'),levels=[...new Set(a)];['Level 1','Level 2','Level 3','Other'].forEach(x=>{if(!levels.includes(x))levels.push(x)});return levels}
function reportKpisV12(){let a=reportAppointmentsV12(),att=reportAttendanceRowsV12(),conducted=a.filter(x=>x.status==='Conducted'),present=a.filter(x=>x.attendance==='Present'),absent=a.filter(x=>x.attendance==='Absent'),late=att.filter(x=>String(x.status).toLowerCase()==='late'),attAbsent=att.filter(x=>String(x.status).toLowerCase()==='absent'),disabled=db.users.filter(x=>x.disability).length,blocked=db.users.filter(x=>x.blocked).length;return{appointments:a.length,conducted:conducted.length,present:present.length,absent:absent.length,late:late.length,attAbsent:attAbsent.length,disabled,blocked}}
function reportSummaryV12(){let k=reportKpisV12();return `<div class="report-kpis"><div><span>Total appointments</span><b>${k.appointments}</b><small>Selected period</small></div><div><span>Conducted</span><b>${k.conducted}</b><small>${k.appointments?Math.round(k.conducted/k.appointments*100):0}% completion</small></div><div><span>Present</span><b>${k.present}</b><small>Recorded attendance</small></div><div class="${k.late||k.attAbsent?'report-kpi-alert':''}"><span>Late / Absent</span><b>${k.late+k.attAbsent}</b><small>${k.late} late · ${k.attAbsent} absent</small></div><div class="report-kpi-special"><span>Special cases</span><b>${k.disabled+k.blocked}</b><small>★ ${k.disabled} disability · ${k.blocked} blocked</small></div></div>`}
function reportProgramBarsV12(){let rows=SERVICES.map(s=>{let a=reportAppointmentsV12().filter(x=>x.service===s.id),conducted=a.filter(x=>x.status==='Conducted').length,present=a.filter(x=>x.attendance==='Present').length;return{s,n:a.length,conducted,present}}),max=Math.max(1,...rows.map(x=>x.n));return `<div class="report-bars">${rows.map(x=>`<div class="report-bar-row"><div><b>${esc(x.s.name)}</b><small>${x.n} appointments · ${x.conducted} conducted · ${x.present} present</small></div><div class="report-bar-track"><i style="width:${Math.round(x.n/max*100)}%"></i></div></div>`).join('')}</div>`}
function reportAttendanceBreakdownV12(){let att=reportAttendanceRowsV12(),labels=['On time','Late','Absent'];return `<div class="report-status-grid">${labels.map(label=>{let n=att.filter(x=>String(x.status||'').toLowerCase()===label.toLowerCase()).length;return `<div><span>${label}</span><b>${n}</b></div>`}).join('')}<div><span>Total records</span><b>${att.length}</b></div></div>`}
function reportOverviewV12(){let special=db.users.filter(x=>x.disability||x.blocked).slice(0,6);return `<div class="report-grid"><div class="panel report-section"><div class="report-section-head"><div><span>PROGRAM PERFORMANCE</span><h3>Activity by ANJIZ service</h3></div></div>${reportProgramBarsV12()}</div><div class="panel report-section"><div class="report-section-head"><div><span>ATTENDANCE STATUS</span><h3>Staff & user attendance</h3></div></div>${reportAttendanceBreakdownV12()}<div class="report-mini-cases"><b>Special status snapshot</b>${special.length?special.map(u=>`<div class="${u.blocked?'blocked-case':''}"><span>${u.disability?'★ ':''}${esc(u.name)}</span><small>${u.blocked?`BLOCKED · ${esc(u.blockDay||dayOf(u.blockDate))} ${esc(u.blockDate||'')} · ${esc(u.reason||'No reason recorded')}`:esc(u.role)}</small></div>`).join(''):'<span class="muted">No special cases recorded.</span>'}</div></div></div>`}
function reportUsersTableV12(){let users=reportUsersV12();return table(['User','Type','Conducted','Present','Conducted Days & Dates','Special Status'],users.map(u=>{let a=reportAppointmentsV12().filter(x=>(x.studentUid===u.uid||x.staffUid===u.uid)&&x.status==='Conducted'),present=a.filter(x=>x.attendance==='Present').length,dates=a.map(x=>`${x.day||dayOf(x.date)} ${x.date}`).join('<br>')||'—',special=u.blocked?`<b>BLOCKED</b><br>${esc(u.blockDay||dayOf(u.blockDate))} ${esc(u.blockDate||'')}<br>${esc(u.reason||'No reason recorded')}`:u.disability?'★ Student with disability':'—';return[`${esc(u.name)}${u.disability?' ★':''}`,esc(u.role),a.length,present,dates,special]}),r=>String(r[5]).includes('BLOCKED')?'blocked':String(r[0]).includes('★')?'star':'')}
function reportAttendanceTableV12(){let rows=reportAttendanceRowsV12().slice().sort((a,b)=>(b.date+(b.login||'')).localeCompare(a.date+(a.login||'')));return table(['User','Type','Day / Date','Login','Logout','Status','Note / Supervisor Comment'],rows.map(x=>[esc(x.name),esc(x.role),`${esc(x.day||dayOf(x.date))}<br><span class="muted">${esc(x.date)}</span>`,esc(x.login||'—'),esc(x.logout||'—'),statusBadge(x.status||'—'),`${esc(x.note||'—')}${x.supervisorComment?`<br><b>${esc(x.supervisorComment)}</b>`:''}`]),r=>/Absent|Late/i.test(String(r[5]))?'blocked':'')}
function reportCoursesTableV12(){return table(['Course / Program','Appointments','Conducted','Present','Absent','Completion'],SERVICES.map(s=>{let a=reportAppointmentsV12().filter(x=>x.service===s.id),c=a.filter(x=>x.status==='Conducted').length,p=a.filter(x=>x.attendance==='Present').length,ab=a.filter(x=>x.attendance==='Absent').length;return[esc(s.name),a.length,c,p,ab,`${a.length?Math.round(c/a.length*100):0}%`]}))}

<script data-anjiz-module="comms-v14">
(()=>{

function c14Targets(aud){
  let users=db.users.filter(x=>x.active!==false);
  if(aud==='FI students') return users.filter(x=>c14Role(x)==='student');
  if(aud==='Instructors') return users.filter(x=>c14Role(x)==='instructor');

function c14AdminAnnouncements(){
  c14Ensure();let queued=db.emailOutbox.filter(x=>x.status==='Queued').length;
  showModal(`<div class="comm-admin-modal"><div class="comm-admin-head"><div><span>ANJIZ COMMUNICATIONS</span><h3>Announcements & Notifications</h3><p>Publish targeted announcements and queue email notifications.</p></div><div class="comm-mini-kpis"><div><b>${db.announcements.length}</b><span>Announcements</span></div><div><b>${queued}</b><span>Queued emails</span></div><div><b>${db.notifications.filter(x=>!x.read).length}</b><span>Unread</span></div></div></div><div class="row"><button class="btn primary" onclick="showModal(c14ComposeHtml())">+ New Announcement</button><button class="btn outline" onclick="openNotifications()">Notification Center</button></div><div class="panel comm-filter compact"><div class="field"><label>Search</label><input id="commSearch" placeholder="Search..." oninput="refreshAnnouncementsV14()"></div><div class="field"><label>Audience</label><select id="commAudienceFilter" onchange="refreshAnnouncementsV14()"><option>All</option><option>All users</option><option>FI students</option><option>Instructors</option><option>Peer-Tutors and Trainees</option><option>Visitors</option><option>Staff</option></select></div><div class="field"><label>Priority</label><select id="commPriorityFilter" onchange="refreshAnnouncementsV14()"><option>All</option><option>Normal</option><option>Important</option><option>Urgent</option></select></div></div><div id="commAnnouncementList">${c14AnnouncementList(true)}</div></div>`)
}
window.c14ComposeHtml=c14ComposeHtml;
function c14SurveyHtml(){
  c14Ensure();let s=db.commsSettings.survey;
  return `<div class="policy-v14"><div class="policy-head"><div><span>ANJIZ SURVEY</span><h3>Survey Configuration</h3><p>Store the final approved survey link and publish it to the intended audience.</p></div><span class="policy-state ${String(s.status||'Draft').toLowerCase()}">${esc(s.status||'Draft')}</span></div><div class="notice">The requirements specify an ANJIZ Survey, but the final official survey URL/form was not included in the supplied requirements. Add the approved link when CIS/ANJIZ provides it.</div><div class="formgrid"><div class="field"><label>Survey Title</label><input id="surveyTitleV14" value="${esc(s.title||'ANJIZ Survey')}"></div><div class="field"><label>Audience</label><select id="surveyAudienceV14"><option ${s.audience==='All users'?'selected':''}>All users</option><option ${s.audience==='FI students'?'selected':''}>FI students</option><option ${s.audience==='Instructors'?'selected':''}>Instructors</option><option ${s.audience==='Staff'?'selected':''}>Staff</option></select></div><div class="field"><label>Open Date</label><input id="surveyOpenV14" type="date" value="${esc(s.opens||'')}"></div><div class="field"><label>Close Date</label><input id="surveyCloseV14" type="date" value="${esc(s.closes||'')}"></div></div><div class="field"><label>Approved Survey URL</label><input id="surveyUrlV14" type="url" value="${esc(s.url||'')}" placeholder="https://..."></div><div class="field"><label>Administrative Note</label><textarea id="surveyNoteV14" rows="3">${esc(s.note||'')}</textarea></div><div class="row"><button class="btn primary" onclick="saveSurveyV14('Published')">Save & Publish</button><button class="btn secondary" onclick="saveSurveyV14('Draft')">Save Draft</button>${s.url?`<button class="btn outline" onclick="window.open(${JSON.stringify(s.url)},'_blank','noopener')">Open Survey</button>`:''}<button class="btn outline" onclick="closeModal()">Close</button></div></div>`
}
window.saveSurveyV14=function(status){let url=el('surveyUrlV14')?.value.trim()||'',title=el('surveyTitleV14')?.value.trim()||'ANJIZ Survey',aud=el('surveyAudienceV14')?.value||'All users',opens=el('surveyOpenV14')?.value||'',closes=el('surveyCloseV14')?.value||'',note=el('surveyNoteV14')?.value.trim()||'';if(status==='Published'&&!url)return alert('Add the approved survey URL before publishing.');db.commsSettings.survey={url,title,audience:aud,status,opens,closes,note};db.surveyUrl=url;if(status==='Published'){let body=`${title} is now available.${closes?' Complete it before '+closes+'.':''}`;c14Targets(aud).forEach(x=>pushNotif(x.uid,title,body))}save();audit(`Survey saved as ${status}`);closeModal()}
function c14RulesHtml(){
  c14Ensure();let r=db.commsSettings.rules;
  return `<div class="policy-v14"><div class="policy-head"><div><span>GOVERNANCE</span><h3>Rules & Regulations</h3><p>Maintain the approved ANJIZ rules, version and effective date.</p></div><span class="policy-state ${String(r.status||'Draft').toLowerCase()}">${esc(r.status||'Draft')}</span></div><div class="notice">The requirements name this section but do not provide the final official policy text. Keep this as Draft until ANJIZ Administration provides the approved wording.</div><div class="formgrid"><div class="field"><label>Document Title</label><input id="rulesTitleV14" value="${esc(r.title||'ANJIZ Rules & Regulations')}"></div><div class="field"><label>Version</label><input id="rulesVersionV14" value="${esc(r.version||'1.0')}"></div><div class="field"><label>Effective Date</label><input id="rulesEffectiveV14" type="date" value="${esc(r.effective||'')}"></div><div class="field"><label>Approved By</label><input id="rulesApprovedV14" value="${esc(r.approvedBy||'')}" placeholder="ANJIZ Administration"></div></div><div class="field"><label>Rules & Regulations Text</label><textarea id="rulesTextV14" rows="14" placeholder="Paste the approved official rules here...">${esc(r.text||'')}</textarea></div><div class="row"><button class="btn primary" onclick="saveRulesV14('Published')">Save & Publish</button><button class="btn secondary" onclick="saveRulesV14('Draft')">Save Draft</button><button class="btn outline" onclick="previewRulesV14()">Preview</button><button class="btn outline" onclick="closeModal()">Close</button></div></div>`
}
window.saveRulesV14=function(status){let title=el('rulesTitleV14')?.value.trim()||'ANJIZ Rules & Regulations',version=el('rulesVersionV14')?.value.trim()||'1.0',effective=el('rulesEffectiveV14')?.value||'',approvedBy=el('rulesApprovedV14')?.value.trim()||'',text=el('rulesTextV14')?.value.trim()||'';if(status==='Published'&&!text)return alert('Add the approved rules text before publishing.');db.commsSettings.rules={title,version,effective,approvedBy,status,text};db.rulesText=text;if(status==='Published'){let body=`${title} v${version} has been published${effective?' effective '+effective:''}.`;c14Targets('All users').forEach(x=>pushNotif(x.uid,title,body))}save();audit(`Rules & Regulations saved as ${status}`);closeModal()}
window.previewRulesV14=function(){let text=el('rulesTextV14')?.value.trim()||db.commsSettings.rules.text||'',title=el('rulesTitleV14')?.value.trim()||'ANJIZ Rules & Regulations',v=el('rulesVersionV14')?.value.trim()||'1.0',eff=el('rulesEffectiveV14')?.value||'';showModal(`<div class="rules-preview"><span>ANJIZ · GOVERNANCE</span><h2>${esc(title)}</h2><div class="comm-meta"><span>Version ${esc(v)}</span><span>${eff?'Effective '+esc(eff):'Effective date pending'}</span></div><pre>${esc(text||'No approved policy text has been entered yet.')}</pre><button class="btn primary full" onclick="closeModal()">Close Preview</button></div>`)}
let oldOpenOther=openOther;
openOther=function(type){c14Ensure();if(type==='announcements')return c14AdminAnnouncements();if(type==='survey')return showModal(c14SurveyHtml());if(type==='rules')return showModal(c14RulesHtml());return oldOpenOther(type)}
openNotifications=function(){c14Ensure();let rows=mineNotifs().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))),unread=rows.filter(x=>!x.read).length;showModal(`<div class="notif-v14"><div class="comm-admin-head"><div><span>NOTIFICATION CENTER</span><h3>ANJIZ Notifications</h3><p>In-app notifications generated by bookings, timetable cycles and announcements.</p></div><div class="comm-mini-kpis"><div><b>${rows.length}</b><span>Total</span></div><div><b>${unread}</b><span>Unread</span></div></div></div><div class="row"><button class="btn primary" onclick="markAllNotificationsV14()">Mark All Read</button><button class="btn outline" onclick="closeModal()">Close</button></div><div class="notif-list">${rows.length?rows.map(x=>`<div class="notif-row ${x.read?'':'unread'}"><i></i><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p><span>${esc(x.date||'')}</span></div><button class="btn outline" onclick="toggleNotificationV14(${JSON.stringify(x.id)})">${x.read?'Mark Unread':'Mark Read'}</button></div>`).join(''):'<div class="empty">No notifications.</div>'}</div></div>`)}
window.markAllNotificationsV14=function(){mineNotifs().forEach(x=>x.read=true);save();updateNotif();openNotifications()}
window.toggleNotificationV14=function(id){let x=db.notifications.find(n=>String(n.id)===String(id));if(x)x.read=!x.read;save();updateNotif();openNotifications()}
c14Ensure();save();
})();


</script>
<script data-anjiz-module="registration-v15">
var regLevelFilterV15='All Levels';
var regServiceFilterV15='all';
function regEnsureV15(){db.instructorHours=db.instructorHours||[];db.peerAvailability=db.peerAvailability||[];db.peerAssignments=db.peerAssignments||[];}
function regRuleV15(service){let s=SERVICES.find(x=>x.id===service);if(!s)return{limit:0,label:'Unknown'};if(s.rule==='two')return{limit:2,label:'Maximum 2 instructors · first 5 students → Instructor 1 · remaining students → Instructor 2'};if(s.rule==='peer')return{limit:1,label:'Peer-Tutor / Trainee based on submitted availability and Admin assignment'};return{limit:1,label:'Maximum 1 instructor for this slot'};}
function regTimeOptionsV15(selected){let times=['09:00-09:45','10:00-10:45','11:00-11:45','12:00-12:45','13:00-13:45'];return times.map(t=>`<option ${t===selected?'selected':''}>${t}</option>`).join('')}
function regFutureV15(date){return !date||date>=localDateISO()}
function regSlotKeyV15(x){return`${x.service}|${x.date}|${x.time}`}
function regGroupsV15(){regEnsureV15();let m=new Map();db.instructorHours.filter(x=>regFutureV15(x.date)).forEach(x=>{let k=regSlotKeyV15(x);if(!m.has(k))m.set(k,{service:x.service,date:x.date,time:x.time,hours:[]});m.get(k).hours.push(x)});return [...m.values()].sort((a,b)=>(a.date+a.time+a.service).localeCompare(b.date+b.time+b.service))}
function regEnglishGroupsV15(){let groups=regGroupsV15().filter(x=>x.service==='eng');let apps=db.appointments.filter(x=>x.service==='eng'&&x.status!=='Cancelled');return groups.map(g=>{let h=g.hours.slice(0,2),slotApps=apps.filter(a=>a.date===g.date&&a.time===g.time),one=h[0],two=h[1],oneApps=one?slotApps.filter(a=>a.staffUid===one.uid):[],twoApps=two?slotApps.filter(a=>a.staffUid===two.uid):[];return{...g,h,slotApps,one,two,oneApps,twoApps}})}
function regKpisV15(){let future=db.instructorHours.filter(x=>regFutureV15(x.date)),engGroups=regEnglishGroupsV15(),peer=db.peerAssignments.filter(x=>regFutureV15(x.date)),needsSecond=engGroups.filter(x=>x.oneApps.length>=5&&!x.two).length;return[['Registered hours',future.length,'Upcoming instructor hours'],['English slots',engGroups.length,'Maximum two instructors each'],['Peer assignments',peer.length,'Availability-based assignments'],['Needs attention',needsSecond,needsSecond?'English slot needs Instructor 2':'No English overflow issues']]}
function regRuleCardsV15(){return `<div class="reg-rule-grid"><div class="reg-rule-card english"><div class="reg-rule-icon">EN</div><div><b>English Remedial</b><span>Maximum 2 instructors in the same slot.</span><small>Students 1–5 → Instructor 1 · Student 6 onward → Instructor 2. Admin can manually reassign by student/level when needed.</small></div></div><div class="reg-rule-card"><div class="reg-rule-icon">1</div><div><b>Single-Instructor Programs</b><span>Math & DL, Conversation, Workshops, Reading Club and Edu-games.</span><small>Only one FI instructor may register for the same program/date/time slot.</small></div></div><div class="reg-rule-card peer"><div class="reg-rule-icon">PT</div><div><b>Peer Tutorials</b><span>Uses Peer-Tutor / Trainee availability.</span><small>Admin chooses the person for the slot; the booking flow uses that assignment first.</small></div></div></div>`}
function regHourRowsV15(){let groups=regGroupsV15();if(regServiceFilterV15!=='all')groups=groups.filter(x=>x.service===regServiceFilterV15);return groups.map(g=>{let rule=regRuleV15(g.service),booked=db.appointments.filter(a=>a.service===g.service&&a.date===g.date&&a.time===g.time&&a.status!=='Cancelled').length;return[`${esc(svc(g.service))}<br><small class="muted">${esc(rule.label)}</small>`,`${esc(dayOf(g.date))}<br><span class="muted">${esc(g.date)}</span>`,esc(g.time),`<div class="reg-staff-stack">${g.hours.map((h,i)=>`<div><span class="reg-order">${i+1}</span><b>${esc(h.name)}</b>${h.levelFocus&&h.levelFocus!=='All Levels'?`<small>${esc(h.levelFocus)}</small>`:''}<button class="reg-remove" onclick="removeInstructorHourV15('${encodeURIComponent(regSlotKeyV15(h))}','${esc(h.uid)}')">×</button></div>`).join('')}</div>`,`<b>${g.hours.length}/${rule.limit}</b><br><span class="muted">${booked} booking${booked===1?'':'s'}</span>`,g.hours.length>=rule.limit?statusBadge('Configured'):statusBadge(g.service==='eng'?'Open for 2nd instructor':'Configured')]} )}
function regHoursTableV15(){let rows=regHourRowsV15();return table(['Program','Day / Date','Time','Registered Staff','Instructor Slots','Status'],rows)}
function regEnglishMonitorV15(){let groups=regEnglishGroupsV15();if(!groups.length)return'<div class="empty-state"><b>No upcoming English slots</b><span>Register an English instructor hour to start the automatic allocation monitor.</span></div>';return `<div class="reg-english-grid">${groups.map(g=>{let first=g.oneApps.length,overflow=g.twoApps.length,needs=first>=5&&!g.two;return `<div class="reg-english-slot ${needs?'needs-attention':''}"><div class="reg-slot-head"><div><span>${esc(dayOf(g.date))} · ${esc(g.date)}</span><b>${esc(g.time)}</b></div>${needs?'<em>2nd instructor required</em>':statusBadge(g.two?'2 instructors':'1 instructor')}</div><div class="reg-lanes"><div><span>Instructor 1 · students 1–5</span><b>${g.one?esc(g.one.name):'Not registered'}</b><div class="reg-meter"><i style="width:${Math.min(100,first/5*100)}%"></i></div><small>${first}/5 assigned to first instructor</small></div><div><span>Instructor 2 · student 6 onward</span><b>${g.two?esc(g.two.name):'Not registered'}</b><div class="reg-meter overflow"><i style="width:${overflow?100:0}%"></i></div><small>${g.two?`${overflow} overflow assignment${overflow===1?'':'s'}`:'Required once first 5 are reached'}</small></div></div><div class="reg-slot-foot"><span>Total bookings: <b>${g.slotApps.length}</b></span><button class="btn outline" onclick="openEnglishSlotV15('${g.date}','${g.time}')">View allocation</button></div></div>`}).join('')}</div>`}
function regEnglishRowsV15(date,time){let rows=db.appointments.filter(x=>x.service==='eng'&&x.status!=='Cancelled'&&(!date||x.date===date)&&(!time||x.time===time));if(regLevelFilterV15!=='All Levels')rows=rows.filter(x=>(x.level||'Other')===regLevelFilterV15);rows.sort((a,b)=>(a.date+a.time+String(a.id)).localeCompare(b.date+b.time+String(b.id)));return rows}
function regEnglishTableV15(date,time){let rows=regEnglishRowsV15(date,time);return table(['Student','Level','Day / Date','Time','Assigned Instructor','Allocation','Manual'],rows.map(a=>{let h=db.instructorHours.filter(x=>x.service==='eng'&&x.date===a.date&&x.time===a.time),idx=h.findIndex(x=>x.uid===a.staffUid),lane=idx===0?'Instructor 1':idx===1?'Instructor 2':'Manual / Historical';return[`${esc(a.student)}<br><span class="muted">${esc(a.studentUid)}</span>`,esc(a.level||'—'),`${esc(a.day||dayOf(a.date))}<br><span class="muted">${esc(a.date)}</span>`,esc(a.time),esc(a.staff),`<span class="reg-lane-pill">${lane}</span>`,`<button class="btn outline" onclick="reassignEnglish(${a.id})">Reassign</button>`]}))}
window.openEnglishSlotV15=function(date,time){showModal(`<div class="reg-modal-head"><span>AUTOMATIC ALLOCATION</span><h3>English Student Distribution</h3><p>${esc(dayOf(date))} · ${esc(date)} · ${esc(time)}</p></div><div class="field"><label>Level view</label><select id="regModalLevel" onchange="regLevelFilterV15=this.value;el('regModalTable').innerHTML=regEnglishTableV15('${date}','${time}')"><option>All Levels</option><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Other</option></select></div><div id="regModalTable">${regEnglishTableV15(date,time)}</div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="closeModal()">Close</button></div>`)}
function regPeerMatchV15(uid,date,time){return db.peerAvailability.some(x=>x.uid===uid&&x.date===date&&time.slice(0,5)>=x.from&&time.slice(0,5)<x.to)}
function regPeerBoardV15(){let avail=db.peerAvailability.filter(x=>regFutureV15(x.date)).sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from)),assign=db.peerAssignments.filter(x=>regFutureV15(x.date)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="reg-peer-columns"><div><div class="reg-subhead"><div><span>SUBMITTED AVAILABILITY</span><h4>Peer-Tutors & Trainees</h4></div><b>${avail.length}</b></div>${avail.length?avail.map(x=>`<div class="reg-availability"><div><b>${esc(x.name)}</b><span>${esc(dayOf(x.date))} · ${esc(x.date)}</span></div><strong>${esc(x.from)}–${esc(x.to)}</strong></div>`).join(''):'<div class="empty-state"><b>No upcoming availability</b><span>Availability submitted by Peer-Tutors/Trainees will appear here.</span></div>'}</div><div><div class="reg-subhead"><div><span>ADMIN ASSIGNMENTS</span><h4>Peer Tutorial Slots</h4></div><b>${assign.length}</b></div>${assign.length?assign.map(x=>`<div class="reg-assignment"><div><b>${esc(x.name)}</b><span>${esc(dayOf(x.date))} · ${esc(x.date)} · ${esc(x.time)}</span></div><div><small>${regPeerMatchV15(x.uid,x.date,x.time)?'Matches availability':'Admin override'}</small><button class="reg-remove" onclick="removePeerAssignmentV15(${x.id||0},'${esc(x.uid)}','${esc(x.date)}','${esc(x.time)}')">×</button></div></div>`).join(''):'<div class="empty-state"><b>No upcoming assignments</b><span>Choose a verified Peer-Tutor or Trainee for a tutorial slot.</span></div>'}</div></div>`}
registrationPage=function(){regEnsureV15();let instructors=db.users.filter(x=>x.role==='Instructor'&&x.active),peers=db.users.filter(x=>['Peer-Tutor','Trainee'].includes(x.role)&&x.active),today=localDateISO();return `<div class="registration-v15"><div class="reg-hero"><div><span>AUTOMATED REGISTRATION</span><h3>Instructor & Peer Allocation</h3><p>Configure ANJIZ staff availability and verify the automatic assignment rules before students book.</p></div><div class="reg-hero-state"><i></i><div><b>Rules active</b><small>Booking assignment uses these registered hours</small></div></div></div>${cards(regKpisV15())}${regRuleCardsV15()}<div class="reg-layout"><div class="reg-main"><div class="panel reg-panel"><div class="reg-panel-head"><div><span>FI INSTRUCTOR HOURS</span><h3>Register an instructor slot</h3><p>The system enforces the maximum number of instructors allowed for each service.</p></div></div><div class="formgrid reg-form"><div class="field"><label>Program</label><select id="regService" onchange="regRegistrationHintV15()">${SERVICES.filter(x=>x.rule!=='peer').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Instructor</label><select id="regInstructor">${instructors.map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.uid)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="regDate" type="date" min="${today}" value="${today}"></div><div class="field"><label>Time</label><select id="regTime">${regTimeOptionsV15('09:00-09:45')}</select></div><div class="field"><label>Level note (optional)</label><select id="regLevelFocus"><option>All Levels</option><option>Level 1</option><option>Level 2</option><option>Level 3</option></select></div></div><div id="regRuleHintV15" class="reg-rule-hint"><b>English Remedial</b><span>${esc(regRuleV15('eng').label)}</span></div><button class="btn primary" onclick="adminRegisterInstructor()">Register Instructor Hour</button></div><div class="panel reg-panel"><div class="reg-panel-head split"><div><span>UPCOMING CONFIGURATION</span><h3>Registered Instructor Hours</h3></div><select onchange="regServiceFilterV15=this.value;el('regHoursTableV15').innerHTML=regHoursTableV15()"><option value="all">All programs</option>${SERVICES.filter(x=>x.rule!=='peer').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div id="regHoursTableV15">${regHoursTableV15()}</div></div><div class="panel reg-panel"><div class="reg-panel-head"><div><span>ENGLISH ALLOCATION MONITOR</span><h3>First 5 / Overflow Distribution</h3><p>Instructor order is the registration order for each English slot. Manual reassignment remains available.</p></div></div>${regEnglishMonitorV15()}<div class="reg-level-bar"><b>Student-level view</b><select onchange="regLevelFilterV15=this.value;el('regEnglishAllV15').innerHTML=regEnglishTableV15()"><option>All Levels</option><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Other</option></select></div><div id="regEnglishAllV15">${regEnglishTableV15()}</div></div></div><aside class="reg-side"><div class="panel reg-panel sticky"><div class="reg-panel-head"><div><span>PEER TUTORIALS</span><h3>Admin Assignment</h3><p>Select from verified Peer-Tutors/Trainees. Matching submitted availability is highlighted before saving.</p></div></div><div class="field"><label>Peer-Tutor / Trainee</label><select id="peerAssignUid" onchange="regPeerHintV15()">${peers.map(x=>`<option value="${x.uid}">${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="peerAssignDate" type="date" min="${today}" value="${today}" onchange="regPeerHintV15()"></div><div class="field"><label>Time</label><select id="peerAssignTime" onchange="regPeerHintV15()">${regTimeOptionsV15('10:00-10:45')}</select></div><div id="regPeerHintV15" class="reg-peer-hint">Choose a person/date/time to check submitted availability.</div><button class="btn primary" style="width:100%" onclick="savePeerAssignment()">Assign Peer-Tutor</button></div></aside></div><div class="panel reg-panel"><div class="reg-panel-head"><div><span>PEER AVAILABILITY & ASSIGNMENTS</span><h3>Peer Tutorial Planning</h3></div></div>${regPeerBoardV15()}</div><div class="panel reg-panel"><div class="toolbar"><div><span class="reg-kicker">VERIFIED USERS</span><h3>Instructor / Peer User Verification</h3><div class="muted">Import the official user list for ID, name, email, extension, role and level verification.</div></div><button class="btn secondary" onclick="downloadUserTemplate()">Download Template</button></div><div class="formgrid"><div class="field"><label>Verification File</label><input id="verifyFile" type="file" accept=".csv,.xlsx,.xls"></div><div class="field"><label>Expected columns</label><input value="ID, Name, Email, Extension, Role, Level" readonly></div></div><div class="row"><button class="btn primary" onclick="importVerificationFile()">Verify & Import</button><span id="verifyResult" class="muted"></span></div></div></div>`}
window.regRegistrationHintV15=function(){let id=el('regService')?.value||'eng',box=el('regRuleHintV15'),r=regRuleV15(id);if(box)box.innerHTML=`<b>${esc(svc(id))}</b><span>${esc(r.label)}</span>`}
window.regPeerHintV15=function(){let uid=el('peerAssignUid')?.value,date=el('peerAssignDate')?.value,time=el('peerAssignTime')?.value||'',box=el('regPeerHintV15');if(!box)return;let ok=regPeerMatchV15(uid,date,time),u=user(uid);box.className='reg-peer-hint '+(ok?'ok':'warn');box.innerHTML=`<b>${esc(u?.name||'Peer')}</b><span>${ok?'Submitted availability covers this slot.':'No matching submitted availability. Admin can still override after confirmation.'}</span>`}

 <div class="inst-grid-secondary">

 </div>
 ${next?`<div class="inst-next-strip"><div><span>NEXT APPOINTMENT</span><b>${esc(next.student)} · ${esc(next.serviceName||svc(next.service))}</b><small>${esc(next.day||dayOf(next.date))} ${esc(next.date)} · ${esc(next.time)}</small></div><button class="btn primary" onclick="openPage('appointments')">Open appointment</button></div>`:''}

dashboard=function(){if(me?.role==='instructor')return instructorDashboardV16();return baseDashboardV16()}

computersPage=function(){if(me?.role!=='instructor')return baseComputersPageV16();let mine=db.computerRequests.filter(x=>x.uid===me.uid).slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),pending=mine.filter(x=>x.status==='Pending').length,approved=mine.filter(x=>x.status==='Approved').length,rejected=mine.filter(x=>x.status==='Rejected').length;return `<div class="inst-computers-v16"><div class="inst-page-hero"><div><span>INSTRUCTOR RESOURCE REQUEST</span><h3>Book ANJIZ Computers</h3><p>Submit a computer request for Supervisor approval and track its status from the same page.</p></div><button class="btn outline" onclick="openPage('dashboard')">Back to Workspace</button></div><div class="inst-mini-kpis"><div><span>Pending</span><b>${pending}</b></div><div><span>Approved</span><b>${approved}</b></div><div><span>Rejected</span><b>${rejected}</b></div><div><span>Total</span><b>${mine.length}</b></div></div><div class="inst-computer-layout"><div class="panel inst-request-form"><div class="inst-panel-head"><div><span>NEW REQUEST</span><h3>Computer booking request</h3></div></div><div class="formgrid"><div class="field"><label>Date</label><input id="compDate" type="date" min="${instTodayV16()}" value="${instTodayV16()}"></div><div class="field"><label>Time</label><input id="compTime" placeholder="e.g. 11:00-12:00"></div><div class="field"><label>No. Computers</label><input id="compCount" type="number" min="1" value="1"></div><div class="field"><label>Purpose</label><input id="compPurpose" placeholder="Purpose of the ANJIZ session"></div></div><div id="compValidationV16" class="inst-form-note">Supervisor approval is required before the request is considered confirmed.</div><button class="btn primary" onclick="submitComputerRequest()">Send to Supervisor</button></div><div class="panel inst-panel"><div class="inst-panel-head"><div><span>REQUEST HISTORY</span><h3>My computer requests</h3></div></div>${mine.length?`<div class="inst-request-list">${mine.map(x=>`<div class="${String(x.status).toLowerCase()}"><div><b>${esc(dayOf(x.date))} · ${esc(x.date)}</b><span>${esc(x.time)} · ${x.count} computer${x.count===1?'':'s'}</span><small>${esc(x.purpose||'—')}</small></div><div>${statusBadge(x.status)}<small>${esc(x.note||'No supervisor note')}</small></div></div>`).join('')}</div>`:'<div class="inst-empty">No computer requests submitted yet.</div>'}</div></div></div>`}

submitComputerRequest=function(){if(me?.role!=='instructor')return;let date=el('compDate')?.value,time=(el('compTime')?.value||'').trim(),count=Number(el('compCount')?.value||0),purpose=(el('compPurpose')?.value||'').trim();if(!date||date<instTodayV16())return alert('Choose today or a future date.');if(!/^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(time))return alert('Enter the time as a range, for example 11:00-12:00.');if(!Number.isFinite(count)||count<1)return alert('Enter a valid number of computers.');if(!purpose)return alert('Enter the purpose of this computer request.');let dup=db.computerRequests.find(x=>x.uid===me.uid&&x.date===date&&x.time.replace(/\s/g,'')===time.replace(/\s/g,'')&&x.status==='Pending');if(dup)return alert('You already have a pending computer request for this date and time.');db.computerRequests.push({id:Date.now(),uid:me.uid,name:me.name,date,time,count,purpose,status:'Pending',note:''});pushNotif('admin','ANJIZ Computer Request',`${me.name} requested ${count} computer${count===1?'':'s'} for ${dayOf(date)} ${date} ${time}.`);queueEmail(db.settings.supervisorEmail,'ANJIZ Computer Booking Request',`${me.name} requested ${count} computer${count===1?'':'s'} on ${dayOf(date)} ${date}, ${time}. Purpose: ${purpose}`);save();audit(`Submitted ANJIZ computer request · ${count} · ${date} ${time}`);openPage('computers')}

window.prepareFIReferralV16=function(uid){let r=db.referrals.find(x=>x.uid===uid),u=user(uid),s=instReferralStatsV16(uid);if(!r&&!u)return;let name=u?.name||r?.student||uid,level=u?.level||r?.level||'—',body=`ANJIZ Referred Student Summary\nStudent: ${name}\nID: ${uid}\nLevel: ${level}\nInstructor: ${me.name}\nAssigned sessions: ${s.apps.length}\nConducted: ${s.conducted}\nPresent: ${s.present}\nAbsent: ${s.absent}\n\nSessions:\n${s.apps.map(x=>`${x.day||dayOf(x.date)} ${x.date} ${x.time} · ${x.serviceName||svc(x.service)} · ${x.status} / ${x.attendance}`).join('\n')||'No assigned sessions.'}`;closeModal();prepareEmail(`ANJIZ Referred Student · ${name}`,body,db.settings.fiEmail)}

(()=>{

<script data-anjiz-module="demo-v19">
(()=>{
 if(window.__anjizDemoV19)return;window.__anjizDemoV19=1;
 const now=()=>new Date().toLocaleString('en-GB',{hour12:false});
 const safe=x=>typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const persist=()=>{try{if(typeof save==='function')save()}catch(e){}};
 const notify=m=>{try{if(typeof toast==='function')toast(m)}catch(e){}};
 function ensure(){
  if(typeof db==='undefined')return false;
  db.demoMailV19=Array.isArray(db.demoMailV19)?db.demoMailV19:[];
  db.emailOutbox=Array.isArray(db.emailOutbox)?db.emailOutbox:[];
  return true;
 }
 function textBody(v){if(Array.isArray(v))return v.map(x=>Array.isArray(x)?x.join(' | '):String(x)).join('\n');if(v&&typeof v==='object'){try{return JSON.stringify(v,null,2)}catch(e){}}return String(v??'')}
 function parseMail(args){
  let to='',subject='',body='',source='ANJIZ';
  const a=[...args];
  if(a[0]&&typeof a[0]==='object'&&!Array.isArray(a[0])){
   const o=a[0];to=o.to||o.email||'';subject=o.subject||o.title||'ANJIZ Notification';body=textBody(o.body||o.message||'');source=o.source||source;
  }else if(String(a[0]||'').includes('@')){
   to=String(a[0]||'');subject=String(a[1]||'ANJIZ Notification');body=textBody(a[2]);source=String(a[3]||source);
  }else{
   subject=String(a[0]||'ANJIZ Notification');body=textBody(a[1]);
   const maybe=String(a[2]||'');to=maybe.includes('@')?maybe:(typeof me!=='undefined'&&me?.email?me.email:(db?.settings?.supervisorEmail||''));source=String(a[3]||source);
  }
  return{to:to||'demo-recipient@university.test',subject,body,source};
 }
 function sendDemo(to,subject,body,source='ANJIZ'){
  if(!ensure())return null;
  const rec={id:Date.now()+Math.floor(Math.random()*1000),to:String(to||''),subject:String(subject||'ANJIZ Notification'),body:textBody(body),source:String(source||'ANJIZ'),status:'Sent · Demo Gateway',sentAt:now(),from:'ANJIZ Demo Mail Gateway'};
  db.demoMailV19.unshift(rec);
  db.emailOutbox.unshift({id:rec.id,to:rec.to,subject:rec.subject,body:rec.body,date:rec.sentAt,status:rec.status,source:rec.source});

 }
 function mailto(rec){

  window.location.href=u;
 }
 function preview(rec){
  if(typeof showModal!=='function'){sendDemo(rec.to,rec.subject,rec.body,rec.source);return}

  window.__anjizV19Preview=rec;
 }
 window.demoV19SendPreview=()=>{const r=window.__anjizV19Preview;if(!r)return;sendDemo(r.to,r.subject,r.body,r.source);if(typeof closeModal==='function')closeModal();setTimeout(openDemoMailCenter,50)};
 window.demoV19OpenMailApp=()=>{const r=window.__anjizV19Preview;if(r)mailto(r)};
 window.queueEmail=(...args)=>{const r=parseMail(args);return sendDemo(r.to,r.subject,r.body,r.source)};
 window.prepareEmail=(...args)=>{const r=parseMail(args);preview(r);return r};

  window.__anjizOldSendAttendanceToFI=sendAttendanceToFI;

  };

 window.openDemoMailCenter=()=>{

<script data-anjiz-module="qr-v20">

(()=>{if(window.__anjizQrCameraV26)return;window.__anjizQrCameraV26=1;

let scanner=null, fieldId='loginId', busy=false;

function statusV26(msg,kind=''){
  const s=document.getElementById('anjizQrStatusV26');
  if(!s)return;
  s.className='notice'+(kind?' '+kind:'');
  s.innerHTML=msg;
}
function loadQrLibV26(){
  return new Promise((resolve,reject)=>{
    if(window.Html5Qrcode)return resolve();
    let s=document.getElementById('anjiz-html5-qrcode-v26');
    if(s){
      if(window.Html5Qrcode)return resolve();
      s.addEventListener('load',resolve,{once:true});
      s.addEventListener('error',reject,{once:true});
      return;
    }
    s=document.createElement('script');
    s.id='anjiz-html5-qrcode-v26';
    s.src=LIB;
    s.async=true;
    s.onload=resolve;
    s.onerror=reject;
    document.head.appendChild(s);
  });
}
function scanValueV26(raw){
  let v=String(raw||'').trim();
  try{
    const u=new URL(v,location.href);
    for(const k of ['verifyUid','uid','id','user','verify']){
      const x=u.searchParams.get(k);
      if(x&&/^[A-Za-z0-9._-]{2,50}$/.test(x))return x.toUpperCase();
    }
  }catch(e){}
  const m=v.match(/(?:ANJIZ\s*[:#|\-]\s*)?([A-Z]{1,5}\d{2,15})/i);
  return (m?m[1]:v).toUpperCase();
}

    field.value=val;

  }

  await stopV26();
  try{closeModal()}catch(e){}
};
window.startAnjizCameraV26=async function(){

  if(!host){busy=false;return}
  statusV26('Requesting camera permission…');

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw new Error('Camera API is not available in this browser.');
    await loadQrLibV26();
    const cams=await Html5Qrcode.getCameras();
    if(!cams||!cams.length)throw new Error('No camera was detected.');
    const preferred=cams.find(c=>/back|rear|environment/i.test(c.label||''))||cams[0];
    scanner=new Html5Qrcode('anjizLiveReaderV26');

      preferred.id,

      raw=>finishV26(raw),

  }

window.readAnjizImageV26=async function(input){
  const file=input?.files?.[0];

    await loadQrLibV26();

    let host=document.getElementById(tempId);
    if(!host){host=document.createElement('div');host.id=tempId;host.style.display='none';document.body.appendChild(host)}

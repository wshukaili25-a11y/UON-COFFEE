<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>شاشة نداء مكتب رئاسة الجامعة | UON Hub Demo</title>
  <meta name="theme-color" content="#06110d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/presidency-booking-demo.css?v=2.0.0">
</head>
<body data-demo-page="queue">
  <main class="public-queue">
    <div class="public-queue-shell">
      <header class="between row">
        <a class="brand" href="/presidency-booking-admin-demo.html"><img src="/assets/icons/uonhub-192-v75.png" alt="UON Hub"><div><strong>مكتب رئاسة الجامعة</strong><small>شاشة نداء تجريبية</small></div></a>
        <span class="eyebrow">Demo</span>
      </header>

      <section class="card public-current-card">
        <p class="muted" style="margin-top:0">الرقم المستدعى حاليًا</p>
        <div id="publicCurrent"></div>
      </section>

      <section class="card public-list">
        <div class="between row"><div><h2>المواعيد التالية</h2><p class="muted" style="margin:0">تعرض أرقام الحجز فقط لحماية خصوصية الطلبة.</p></div></div>
        <div id="publicQueueList" style="margin-top:12px"></div>
      </section>

      <div class="queue-updated">آخر تحديث: <span id="queueUpdatedAt">—</span> · تتحدث الشاشة تلقائيًا</div>
      <div class="demo-notice">هذه شاشة تجريبية ولا تمثل نظامًا رسميًا لجامعة نزوى.</div>
    </div>
  </main>
  <script type="module" src="/js/presidency-booking-demo.js?v=2.0.0"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة ملخص</title>
<link rel="stylesheet" href="site-enhancements.css">
<link rel="stylesheet" href="brand.css">
<script>
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(reg){reg.unregister();});
      }).catch(function(){});
    }
    if('caches' in window){
      caches.keys().then(function(keys){keys.forEach(function(key){caches.delete(key);});}).catch(function(){});
    }
  }catch(e){}
})();
</script></head>
<body>
<h2>إضافة ملخص جديد</h2>
<p>نموذج أولي لربط رفع الملفات مع Supabase Storage.</p>

<input placeholder="عنوان الملخص"><br><br>
<input placeholder="رمز المادة"><br><br>
<input placeholder="الكلية"><br><br>
<input type="file" accept=".pdf"><br><br>

<button>رفع الملخص</button>
<script src="app-status.js"></script>
<script src="language.js" defer></script>
</body>
</html>

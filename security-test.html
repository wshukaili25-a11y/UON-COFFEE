<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#08111f"><title>مختبر الاختبار الأمني | UON Hub</title><link rel="stylesheet" href="css/app.css?v=49.0.0"><style>body{background:#08111f;color:#eef4ff;font-family:Tajawal,sans-serif}.lab{max-width:980px;margin:auto;padding:24px}.lab-head,.lab-card{background:#0d1a2d;border:1px solid #233b59;border-radius:20px;padding:20px;margin-bottom:16px}.lab-head h1{margin:8px 0}.lab-note{color:#a9b9cd;line-height:1.8}.lab-actions{display:flex;gap:10px;flex-wrap:wrap}.lab button,.lab a{min-height:44px;border-radius:12px;padding:0 16px;border:1px solid #355171;background:#142640;color:#fff;font:700 14px Tajawal;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.lab button.primary{background:#6d7fff;border-color:#6d7fff}.lab button:disabled{opacity:.55}.lab-score{font-size:42px;font-weight:900}.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.test{padding:14px;border:1px solid #294562;border-radius:14px;background:#0a1728}.test strong{display:block;margin-bottom:6px}.test small{color:#9fb0c4;line-height:1.6}.pass{border-color:#1e8a64}.warn{border-color:#a87b22}.fail{border-color:#a83e4c}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#172c48;font-size:12px}.progress{height:8px;border-radius:99px;background:#17263a;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;width:0;background:#6d7fff;transition:.25s}.hidden{display:none!important}</style></head><body><main class="lab"><section class="lab-head"><span class="badge">Owner Security Lab</span><h1>مختبر الاختبار الأمني الآمن</h1><p class="lab-note">يفحص UON Hub فقط باختبارات غير مدمرة ومحدودة السرعة. لا ينفذ استغلالًا، ولا حذفًا، ولا ضغطًا عاليًا على الخادم.</p><div class="lab-actions"><button id="runTests" class="primary">بدء الفحص الآمن</button><button id="exportReport">تصدير التقرير JSON</button><a href="owner-dashboard.html">الرجوع للوحة المالك</a></div><div class="progress"><i id="progressBar"></i></div></section><section class="lab-card"><div class="lab-score" id="score">—</div><p id="summary" class="lab-note">سجل دخول المالك مطلوب قبل تشغيل الفحص.</p></section><section id="results" class="lab-grid"></section></main><script type="module" src="js/security-test-v49.js?v=49.0.0"></script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex,nofollow">
  <title>غير متصل | UON Hub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#06100c;--bg2:#091711;--card:rgba(10,25,18,.9);--line:rgba(105,210,153,.16);--text:#f4f8f5;--muted:#9db0a5;--green:#18a465;--green2:#76d8a4;--shadow:0 30px 80px rgba(0,0,0,.32)}
    html[data-theme="light"]{color-scheme:light;--bg:#f2f7f4;--bg2:#e8f2ec;--card:rgba(255,255,255,.94);--line:rgba(16,104,62,.13);--text:#0d1b14;--muted:#617269;--green:#118a54;--green2:#16784d;--shadow:0 26px 66px rgba(20,72,43,.11)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}body{min-height:100svh;background:radial-gradient(circle at 10% 88%,rgba(29,165,101,.12),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text)}
    .shell{min-height:100svh;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .card{width:min(560px,100%);text-align:center;padding:38px 24px;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .logo-wrap{width:82px;height:82px;margin:0 auto 20px;border-radius:26px;display:grid;place-items:center;background:rgba(24,164,101,.08);border:1px solid rgba(24,164,101,.15)}.logo{width:62px;height:62px;border-radius:50%;object-fit:cover}
    .network{width:max-content;margin:0 auto 16px;padding:7px 11px;border-radius:999px;border:1px solid rgba(24,164,101,.14);background:rgba(24,164,101,.06);color:var(--green2);font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}.network i{width:7px;height:7px;border-radius:50%;background:#df6e69}
    h1{margin:0;font-size:clamp(27px,7vw,40px);line-height:1.25;font-weight:900;letter-spacing:-.03em}.lead{max-width:430px;margin:14px auto 0;color:var(--muted);font-size:15px;line-height:1.9}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.btn{min-height:48px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:linear-gradient(135deg,#15975d,#0d7d4c);border-color:transparent;color:#fff}.hint{margin-top:17px;color:var(--muted);font-size:12px;line-height:1.7}
    .mini{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.mini a{color:var(--text);font-weight:800;text-decoration:none;direction:ltr}
    @media(max-width:440px){.card{padding:32px 18px;border-radius:25px}.actions{grid-template-columns:1fr}.logo-wrap{width:74px;height:74px;border-radius:23px}.logo{width:56px;height:56px}}
  </style>
</head>
<body data-uon-page="offline">
  <main class="shell">
    <section class="card">
      <div class="logo-wrap"><img class="logo" src="/assets/uonhub-logo-original-20260904.jpeg" alt="UON Hub"></div>
      <div class="network"><i></i><span data-ar="أنت غير متصل الآن" data-en="You're currently offline">أنت غير متصل الآن</span></div>
      <h1 data-ar="الإنترنت فصل شوي 😅" data-en="You're offline for a moment">الإنترنت فصل شوي 😅</h1>
      <p class="lead" data-ar="بعض الأشياء المحفوظة في UON Hub قد تظل متاحة على جهازك. تأكد من الشبكة وبعدها جرّب مرة ثانية." data-en="Some saved UON Hub content may still be available on your device. Check your connection, then try again.">بعض الأشياء المحفوظة في UON Hub قد تظل متاحة على جهازك. تأكد من الشبكة وبعدها جرّب مرة ثانية.</p>
      <div class="actions">
        <button class="btn primary" type="button" id="retry"><span>↻</span><span data-ar="إعادة المحاولة" data-en="Try again">إعادة المحاولة</span></button>
        <button class="btn" type="button" id="language"><span>文</span><span id="languageText">English</span></button>
      </div>
      <p class="hint" data-ar="بياناتك المحفوظة محليًا على جهازك ما تنحذف بسبب انقطاع الاتصال." data-en="Locally saved data on your device won't be removed because of a connection loss.">بياناتك المحفوظة محليًا على جهازك ما تنحذف بسبب انقطاع الاتصال.</p>
      <div class="mini"><span>UON Hub</span><span>·</span><a href="https://www.instagram.com/uonhub" target="_blank" rel="noopener noreferrer">@uonhub</a></div>
    </section>
  </main>
  <script>
    (()=>{const L='uon_language',T='uon_theme';const lang=()=>{try{return localStorage.getItem(L)==='en'?'en':'ar'}catch{return'ar'}};const theme=()=>{try{return localStorage.getItem(T)==='light'?'light':'dark'}catch{return'dark'}};function apply(){const en=lang()==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.documentElement.dataset.theme=theme();document.querySelectorAll('[data-ar][data-en]').forEach(n=>n.textContent=en?n.dataset.en:n.dataset.ar);document.querySelector('#languageText').textContent=en?'العربية':'English';document.title=en?'Offline | UON Hub':'غير متصل | UON Hub';const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=theme()==='light'?'#f2f7f4':'#07110d'}apply();document.querySelector('#language').onclick=()=>{try{localStorage.setItem(L,lang()==='en'?'ar':'en')}catch{}apply()};document.querySelector('#retry').onclick=()=>location.reload();window.addEventListener('online',()=>location.reload())})();
  </script>
  <script type="module" src="/js/pwa-init.js?v=67.0.2"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b1b">
<title>تحديث UON Hub</title>
<style>
html,body{margin:0;min-height:100%;background:#060b1b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);text-align:center}.logo{width:72px;height:72px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#8b5cf6);font-size:28px;font-weight:900}.loader{width:190px;height:5px;margin:24px auto 14px;border-radius:99px;background:#202a43;overflow:hidden}.loader::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#8b5cf6;animation:move 1s infinite alternate ease-in-out}@keyframes move{to{transform:translateX(125%)}}p{color:#b7c1d6;line-height:1.8}</style>
</head>
<body>
<main class="box"><div class="logo">U1</div><h1>جاري تحديث UON Hub</h1><div class="loader"></div><p>تنظيف النسخة القديمة وتشغيل آخر إصدار…</p></main>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const registrations=await navigator.serviceWorker.getRegistrations();
   await Promise.all(registrations.map(registration=>registration.unregister()));
  }
  if('caches' in window){
   const names=await caches.keys();
   await Promise.all(names.filter(name=>name.startsWith('uonhub-')).map(name=>caches.delete(name)));
  }
 }catch(error){console.warn('Recovery cleanup skipped',error)}
 location.replace('/index.html?uon_recovered=42&t='+Date.now());
})();
</script>
</body>
</html>

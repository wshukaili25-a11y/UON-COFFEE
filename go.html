<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex,nofollow">
  <title>فتح الرابط | UON Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#06100c;--bg2:#091711;--card:rgba(10,25,18,.9);--line:rgba(105,210,153,.16);--text:#f4f8f5;--muted:#9db0a5;--green:#18a465;--green2:#76d8a4;--shadow:0 30px 80px rgba(0,0,0,.32)}
    html[data-theme="light"]{color-scheme:light;--bg:#f2f7f4;--bg2:#e8f2ec;--card:rgba(255,255,255,.94);--line:rgba(16,104,62,.13);--text:#0d1b14;--muted:#617269;--green:#118a54;--green2:#16784d;--shadow:0 26px 66px rgba(20,72,43,.11)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;background:radial-gradient(circle at 82% 10%,rgba(27,176,105,.13),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text)}
    .shell{min-height:100svh;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .card{width:min(560px,100%);text-align:center;padding:38px 24px;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .logo-wrap{width:80px;height:80px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;background:rgba(24,164,101,.08);border:1px solid rgba(24,164,101,.15)}.logo{width:60px;height:60px;border-radius:50%;object-fit:cover}
    .kicker{display:inline-flex;align-items:center;gap:7px;color:var(--green2);font-size:12px;font-weight:900;margin-bottom:10px}.kicker i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    h1{margin:0;font-size:clamp(27px,7vw,38px);line-height:1.25;font-weight:900;letter-spacing:-.025em}.lead{max-width:430px;margin:13px auto 0;color:var(--muted);font-size:15px;line-height:1.9}
    .spinner{width:28px;height:28px;margin:24px auto;border:3px solid rgba(130,160,143,.15);border-top-color:var(--green);border-radius:50%;animation:spin .82s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .home{min-height:48px;padding:0 18px;border-radius:15px;background:linear-gradient(135deg,#15975d,#0d7d4c);color:#fff;text-decoration:none;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
    .mini{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.mini a{color:var(--text);font-weight:900;text-decoration:none;direction:ltr}
    @media(max-width:440px){.card{padding:32px 18px;border-radius:25px}.home{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="logo-wrap"><img class="logo" src="/assets/uonhub-logo-original-20260904.jpeg" alt="UON Hub"></div>
      <div class="kicker"><i></i><span id="goKicker">UON Hub</span></div>
      <h1 id="goTitle">جاري فتح الرابط</h1>
      <p class="lead" id="goMessage">نتحقق من الرابط ثم ننقلك للوجهة المطلوبة.</p>
      <div class="spinner" id="goSpinner" aria-label="جاري التحميل"></div>
      <a class="home" id="goHome" href="/index.html" hidden>العودة للرئيسية</a>
      <div class="mini">UON Hub · <a href="https://www.instagram.com/uonhub" target="_blank" rel="noopener noreferrer">@uonhub</a></div>
    </section>
  </main>
  <script type="module" src="/js/go.js?v=67.0.1"></script>
</body>
</html>

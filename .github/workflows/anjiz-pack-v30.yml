name: Build validated ANJIZ runtime (manual only)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anjiz-system-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate runtime
        run: node anjiz-v7/build-runtime.mjs
      - name: Commit generated pack
        run: |
          if git diff --quiet -- anjiz-v7/index.html anjiz-v7/v16-full-loader.pack.b64; then
            echo "Pack already current"
            exit 0
          fi
          git config user.name "ANJIZ Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add anjiz-v7/index.html anjiz-v7/v16-full-loader.pack.b64
          git commit -m "Build validated ANJIZ runtime"
          git push origin HEAD:anjiz-system-v7

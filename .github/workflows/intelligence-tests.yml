name: Intelligence Preview Tests
on:
  push:
    branches:
      - feature/uon-hub-intelligence
  pull_request:
    paths:
      - "api/intelligence-summary.js"
      - "tests/intelligence-summary.test.mjs"
      - ".github/workflows/intelligence-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: node --test tests/intelligence-summary.test.mjs

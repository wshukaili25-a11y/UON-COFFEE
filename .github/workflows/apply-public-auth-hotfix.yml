name: apply-public-auth-hotfix

on:
  push:
    branches:
      - hotfix/public-supabase-auth-v67

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/public-supabase-auth-v67
      - name: Remove invalid publishable-key bearer headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old="H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}"
          new="H={'apikey':KEY,'Content-Type':'application/json'}"
          for name in ['questions.html','marketplace.html']:
              p=Path(name)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'expected auth pattern missing in {name}')
              p.write_text(text.replace(old,new,1))
              print('patched',name)
          PY
      - name: Commit exact hotfix
        shell: bash
        run: |
          if git diff --quiet -- questions.html marketplace.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add questions.html marketplace.html
          git commit -m 'fix(public): use publishable key as apikey only'
          git push origin HEAD:hotfix/public-supabase-auth-v67

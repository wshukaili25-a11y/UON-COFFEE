name: normalize-pwa-cache-v67

on:
  push:
    branches:
      - release/normalize-pwa-cache-v67

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Normalize public cache-bust references
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const files=execFileSync('git',['ls-files','*.html'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const replacements=[
            [/(\/?js\/pwa-init\.js\?v=)[^\"'\s<>]+/g,'$167.0.2'],
            [/(\.\/?js\/v14-ui\.js\?v=)[^\"'\s<>]+/g,'$167.0.2'],
            [/(\/?js\/maintenance\.js\?v=)[^\"'\s<>]+/g,'$167.0.2']
          ];
          let changed=0;
          for(const file of files){
            const before=fs.readFileSync(file,'utf8');
            let after=before;
            for(const [pattern,replacement] of replacements) after=after.replace(pattern,replacement);
            if(after!==before){fs.writeFileSync(file,after);changed++;console.log(`normalized ${file}`)}
          }
          console.log(`normalized_files=${changed}`);
          NODE
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cache references needed normalization."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "chore(cache): normalize v67 public asset references"
          git push

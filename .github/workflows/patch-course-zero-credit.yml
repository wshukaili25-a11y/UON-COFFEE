name: Patch Course Zero Credit Display

on:
  push:
    paths:
      - 'scripts/trigger-course-zero-credit.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh course page versions and PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('courses.html','course.html'):
              path=Path(name)
              text=path.read_text(encoding='utf-8').replace('32.4.0','32.4.1')
              path.write_text(text,encoding='utf-8')

          path=Path('sw.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("uonhub-pwa-v32-4-0","uonhub-pwa-v32-4-1")
          text=text.replace('32.4.0','32.4.1')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses.html course.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Release zero-credit course display V32.4.1"
          git push

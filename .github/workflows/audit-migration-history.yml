name: audit-migration-history

on:
  push:
    branches:
      - diagnostic/supabase-db-secret-probe-v67

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Audit current migration versions
        shell: bash
        run: |
          echo '=== CURRENT MIGRATION VERSION AUDIT ==='
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import re
          files=sorted(Path('supabase/migrations').glob('*.sql'))
          versions=defaultdict(list)
          malformed=[]
          for p in files:
            name=p.name
            version=name.split('_',1)[0]
            versions[version].append(name)
            if not re.fullmatch(r'\d{14}', version):
              malformed.append((version,name))
          print(f'total={len(files)}')
          print('MALFORMED_VERSION_PREFIXES')
          for version,name in malformed:
            print(f'{version} :: {name}')
          print('DUPLICATE_VERSION_PREFIXES')
          for version,names in sorted(versions.items()):
            if len(names)>1:
              print(f'{version} :: ' + ' | '.join(names))
          PY
      - name: Find deleted migration files across all history
        shell: bash
        run: |
          echo '=== DELETED MIGRATIONS IN GIT HISTORY ==='
          git log --all --full-history --diff-filter=D --name-status --pretty='format:COMMIT %H %cI %s' -- supabase/migrations || true
      - name: Find renamed migration files across all history
        shell: bash
        run: |
          echo '=== RENAMED MIGRATIONS IN GIT HISTORY ==='
          git log --all --full-history --find-renames --diff-filter=R --name-status --pretty='format:COMMIT %H %cI %s' -- supabase/migrations || true

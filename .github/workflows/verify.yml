name: UON Hub Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Supabase migration history audit
        run: node scripts/audit-supabase-migrations.mjs
      - name: Verify modules and configuration
        run: npm run vercel-build

name: Patch Telegram Course Flow

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_telegram_course_flow.py'
      - '.github/workflows/patch-telegram-course-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Telegram bot
        run: python scripts/patch_telegram_course_flow.py
      - name: Commit patched function
        run: |
          if git diff --quiet -- supabase/functions/telegram-admin/index.ts; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/telegram-admin/index.ts
          git commit -m "Rebuild Telegram course academic selection flow"
          git push

name: Supabase Release Credential Probe

on:
  push:
    branches:
      - redesign/uon-green-v2
    paths:
      - .github/workflows/supabase-release-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      TOKEN_ACCESS: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_PAT: ${{ secrets.SUPABASE_PAT }}
      TOKEN_GENERIC: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check Supabase management credential presence
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_ACCESS:-}" ]; then
            echo "::notice::Supabase management credential is configured as SUPABASE_ACCESS_TOKEN."
            exit 0
          fi
          if [ -n "${TOKEN_PAT:-}" ]; then
            echo "::notice::Supabase management credential is configured as SUPABASE_PAT."
            exit 0
          fi
          if [ -n "${TOKEN_GENERIC:-}" ]; then
            echo "::notice::Supabase management credential is configured as SUPABASE_TOKEN."
            exit 0
          fi
          echo "::error::No supported Supabase management credential secret is configured."
          exit 1
